<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Creative OS</title><style>:root{--bg:#f6f7fb;--card:#fff;--text:#16181d;--muted:#6f7785;--line:#e5e8ee;--blue:#5b6cff;--blue2:#eef0ff;--green:#1fa56f;--green2:#e9f8f1;--amber:#b87812;--amber2:#fff4dd;--purple:#7b5cff;--purple2:#f1edff;--red:#d84b57;--shadow:0 8px 28px #2222}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#11131a;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;margin:4px 8px 22px}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:10px;padding:11px 12px;text-align:left;color:#aeb5c3;background:transparent}.nav button.active{background:#5b6cff;color:#fff}.main{padding:26px;max-width:1440px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.title h1{font-size:27px;margin:0}.title p{margin:5px 0 0;color:var(--muted)}.actions,.toolbar{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:#222;border-radius:11px;padding:10px 13px;font-weight:650;cursor:pointer}.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.toolbar{margin-bottom:18px}.input,.select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#222;outline:none}.input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #2220000d;cursor:pointer}.thumb{aspect-ratio:4/5;background:#edf0f4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:cover}.count{position:absolute;right:9px;top:9px;background:#fff;color:#222;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700;box-shadow:0 2px 8px #0002}.meta{padding:12px}.name{font-weight:800;font-size:14px;line-height:1.25}.sub{font-size:11px;color:var(--muted);margin-top:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{font-size:10px;font-weight:800;padding:5px 7px;border-radius:999px}.sReady{color:#167552;background:var(--green2)}.sReview{color:#8a5c11;background:var(--amber2)}.sDraft{color:#5f45ce;background:var(--purple2)}.sLive{color:#315bd8;background:#eaf0ff}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:10px;padding:4px 6px;border-radius:7px;background:#f0f2f6;color:#5c6370}.mobilebar{display:none}.drawer{position:fixed;inset:0;background:#12141abf;display:none;z-index:30}.drawer.open{display:flex;justify-content:flex-end}.sheet{width:min(980px,96vw);height:100%;background:#fff;overflow:auto;position:relative}.sheetHead{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:16px 18px 0}.sheetTop{display:flex;justify-content:space-between;gap:15px;align-items:center}.sheet h2{margin:0;font-size:22px}.tabs{display:flex;gap:4px;margin-top:14px}.tab{border:0;background:transparent;padding:11px 14px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.pane{display:none;padding:18px}.pane.active{display:block}.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.slide{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f4f5f8}.slide img{width:100%;display:block;cursor:zoom-in}.slideNum{padding:7px 9px;color:var(--muted);font-size:11px}.commentBox{background:#f8f9fc;border:1px solid var(--line);border-radius:14px;padding:14px}.commentBox h3{margin:0 0 5px}.notes{width:100%;min-height:135px;border:1px solid #ccd2dc;background:#fff;border-radius:11px;padding:12px;resize:vertical}.helper{font-size:12px;color:var(--muted);margin-top:7px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}.zoom{position:fixed;inset:0;background:#000e;z-index:60;display:none;place-items:center;padding:18px}.zoom.open{display:grid}.zoom img{max-height:90vh;max-width:94vw;object-fit:contain}.zoom button{position:absolute;top:18px;right:18px;background:#fff;color:#111;border:0;border-radius:999px;width:44px;height:44px;font-size:22px}.modal{position:fixed;inset:0;background:#15171dbf;z-index:50;display:none;place-items:center;padding:16px}.modal.open{display:grid}.modalBox{background:#fff;width:min(560px,100%);border-radius:16px;padding:18px}.modalBox h2{margin:0 0 14px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:16px 12px 92px}.title h1{font-size:22px}.title p{font-size:12px}.actions{display:none}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar .input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{aspect-ratio:4/5}.meta{padding:10px}.name{font-size:13px}.tags{display:none}.mobilebar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:8px;gap:8px}.mobilebar button{flex:1;border:0;border-radius:11px;padding:11px 8px;font-weight:800}.mobilebar .library{background:var(--blue2);color:var(--blue)}.mobilebar .add{background:var(--blue);color:white}.mobilebar .share{background:var(--green2);color:var(--green)}.sheet{width:100vw}.sheetHead{padding:13px 14px 0}.sheet h2{font-size:19px}.pane{padding:14px}.slides{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.detailgrid{grid-template-columns:1fr}.tab{flex:1;padding:10px 4px;font-size:12px}.commentBox{padding:12px}.notes{min-height:150px}}@media(max-width:390px){.grid{gap:8px}.meta{padding:8px}.name{font-size:12px}.sub{font-size:10px}}</style></head><body><div class="app"><aside class="side"><div class="brand">Creative OS</div><div class="nav"><button class="active">Content Library</button><button>In Review</button><button>Ready to Publish</button><button>Live</button><button>Winners</button><button>Archive</button></div></aside><main class="main"><div class="top"><div class="title"><h1>Content Library</h1><p>Creative review, feedback and publishing workspace.</p></div><div class="actions"><button class="btn green" onclick="sharePage()">Share workspace</button><button class="btn blue" onclick="openAdd()">+ Add creative</button></div></div><div class="toolbar"><input id="search" class="input" placeholder="Search creatives…" oninput="render()"><select id="filter" class="select" onchange="render()"><option value="all">All statuses</option><option>Draft</option><option>Review</option><option>Ready</option><option>Live</option></select><select id="sort" class="select" onchange="render()"><option value="new">Newest</option><option value="name">A–Z</option></select></div><div id="grid" class="grid"></div></main></div><div class="mobilebar"><button class="library" onclick="window.scrollTo({top:0,behavior:'smooth'})">Library</button><button class="share" onclick="sharePage()">Share</button><button class="add" onclick="openAdd()">+ Add</button></div><div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div class="sheet"><div class="sheetHead"><div class="sheetTop"><div><h2 id="dName"></h2><div id="dSub" class="sub"></div></div><button class="btn" onclick="closeDrawer()">✕ Close</button></div><div class="tabs"><button id="tPreview" class="tab active" onclick="tab('preview')">Preview</button><button id="tComments" class="tab" onclick="tab('comments')">Comments</button><button id="tDetails" class="tab" onclick="tab('details')">Details</button></div></div><section id="pPreview" class="pane active"><div id="slides" class="slides"></div></section><section id="pComments" class="pane"><div class="commentBox"><h3>Feedback & comments</h3><div class="helper">Leave revisions, publishing notes or feedback here. Saved automatically on this device.</div><textarea id="dNotes" class="notes" placeholder="Example: slide 2 headline needs to be shorter…" oninput="saveNotes()"></textarea></div></section><section id="pDetails" class="pane"><div class="detailgrid"><div class="field"><label>Status</label><select id="dStatus" class="select" onchange="saveStatus()"><option>Draft</option><option>Review</option><option>Ready</option><option>Live</option></select></div><div class="field"><label>Share</label><button class="btn green" style="width:100%" onclick="shareCreative()">Copy creative link</button></div></div></section></div></div><div id="zoom" class="zoom" onclick="if(event.target===this)closeZoom()"><button onclick="closeZoom()">×</button><img id="zoomImg"></div><div id="modal" class="modal"><div class="modalBox"><h2>Add creative</h2><div class="field"><label>Name</label><input id="aName" class="input" style="width:100%" placeholder="Creative name"></div><div class="field" style="margin-top:12px"><label>Image URLs, one per line</label><textarea id="aUrls" class="notes" placeholder="https://…\nhttps://…"></textarea></div><div class="field" style="margin-top:12px"><label>Tags, comma separated</label><input id="aTags" class="input" style="width:100%" placeholder="Instagram, carousel, UGC"></div><div class="modalActions"><button class="btn" onclick="closeAdd()">Cancel</button><button class="btn blue" onclick="addCreative()">Add creative</button></div></div></div><script>const defaults=[{id:'sidequest',name:'SideQuest Carousel',platform:'Instagram Carousel',status:'Ready',date:'2026-09-03',tags:['SideQuest','Carousel','Social'],slides:['https://cdn.creativeclaw.co/u/c6372787/images/cdbc48a6-b8e8-427d-b15e-58f0e5363154.png','https://cdn.creativeclaw.co/u/c6372787/images/bbea0c32-15ab-46a8-b21e-7ddd4d35c1bc.png','https://cdn.creativeclaw.co/u/c6372787/images/d3140f85-753f-4277-b93b-5ecf09c2fa67.png','https://cdn.creativeclaw.co/u/c6372787/images/01a23421-fa72-4793-b1e9-f7737f401dd4.png','https://cdn.creativeclaw.co/u/c6372787/images/67392296-5261-47ba-89a7-8246b0b25fe8.png']},{id:'screen-time',name:'5-Day Experiment',platform:'TikTok / Instagram',status:'Review',date:'2026-09-03',tags:['Photo Mode','UGC','Carousel'],slides:['https://cdn.creativeclaw.co/u/c6372787/images/d8c5fe5c-8815-40b0-8a41-b9479901cf97.png','https://cdn.creativeclaw.co/u/c6372787/images/2aa5d60b-ad63-4f8b-8b8c-0a5bb6ff22d9.png','https://cdn.creativeclaw.co/u/c6372787/images/ac1398ba-05fb-40ea-b859-4f2bc03b25aa.png','https://cdn.creativeclaw.co/u/c6372787/images/3193d593-53d2-4105-85b0-43d8b1004af7.png','https://cdn.creativeclaw.co/u/c6372787/images/b83418ab-f2d6-498a-b2f1-09a097a6dd3a.png']}];let creatives=JSON.parse(localStorage.getItem('creative-os-items')||'null')||defaults;let current=null;const notes=JSON.parse(localStorage.getItem('creative-os-notes')||'{}');function persist(){localStorage.setItem('creative-os-items',JSON.stringify(creatives))}function sc(s){return'status s'+s}function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let a=creatives.filter(c=>(f==='all'||c.status===f)&&([c.name,c.platform,...c.tags].join(' ').toLowerCase().includes(q)));if(document.getElementById('sort').value==='name')a.sort((x,y)=>x.name.localeCompare(y.name));else a.sort((x,y)=>y.date.localeCompare(x.date));document.getElementById('grid').innerHTML=a.map(c=>`<article class="card" onclick="openCreative('${c.id}')"><div class="thumb"><img src="${c.slides[0]}"><div class="count">${c.slides.length} slides</div></div><div class="meta"><div class="row"><div class="name">${c.name}</div><span class="${sc(c.status)}">${c.status}</span></div><div class="sub">${c.platform} · ${c.date}</div><div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></article>`).join('')}function tab(n){['Preview','Comments','Details'].forEach(x=>{document.getElementById('t'+x).classList.toggle('active',x.toLowerCase()===n);document.getElementById('p'+x).classList.toggle('active',x.toLowerCase()===n)})}function openCreative(id){current=creatives.find(c=>c.id===id);document.getElementById('dName').textContent=current.name;document.getElementById('dSub').textContent=`${current.platform} · ${current.slides.length} slides · ${current.date}`;document.getElementById('dStatus').value=current.status;document.getElementById('dNotes').value=notes[current.id]||'';document.getElementById('slides').innerHTML=current.slides.map((u,i)=>`<div class="slide"><img src="${u}" onclick="event.stopPropagation();openZoom('${u}')"><div class="slideNum">Slide ${i+1} · tap to zoom</div></div>`).join('');tab('preview');document.getElementById('drawer').classList.add('open');history.replaceState(null,'','#'+current.id)}function closeDrawer(){document.getElementById('drawer').classList.remove('open');history.replaceState(null,'',location.pathname)}function openZoom(u){document.getElementById('zoomImg').src=u;document.getElementById('zoom').classList.add('open')}function closeZoom(){document.getElementById('zoom').classList.remove('open')}function saveNotes(){if(!current)return;notes[current.id]=document.getElementById('dNotes').value;localStorage.setItem('creative-os-notes',JSON.stringify(notes))}function saveStatus(){if(!current)return;current.status=document.getElementById('dStatus').value;persist();render()}function shareCreative(){navigator.clipboard.writeText(location.origin+location.pathname+'#'+current.id);alert('Creative link copied')}function sharePage(){navigator.clipboard.writeText(location.href.split('#')[0]);alert('Workspace link copied')}function openAdd(){document.getElementById('modal').classList.add('open')}function closeAdd(){document.getElementById('modal').classList.remove('open')}function addCreative(){const name=aName.value.trim(),urls=aUrls.value.split('\n').map(x=>x.trim()).filter(Boolean),tags=aTags.value.split(',').map(x=>x.trim()).filter(Boolean);if(!name||!urls.length)return alert('Add a name and at least one image URL');creatives.unshift({id:'c-'+Date.now(),name,platform:'Social',status:'Draft',date:new Date().toISOString().slice(0,10),tags,slides:urls});persist();closeAdd();render()}render();if(location.hash){const id=location.hash.slice(1);if(creatives.some(c=>c.id===id))setTimeout(()=>openCreative(id),100)}</script></body></html>
