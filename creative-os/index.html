<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative OS — Content Workspace</title><style>:root{--bg:#0b0d10;--panel:#12161b;--panel2:#171c22;--text:#f5f7fa;--muted:#929baa;--line:#252c35;--accent:#fff;--green:#58d68d;--amber:#f5b041}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;background:#0d1014}.brand{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:4px 8px 24px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);border:0;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:#fff}.mini{margin:28px 10px 0;color:#697280;font-size:12px}.main{padding:26px 30px 60px;max-width:1500px;width:100%;margin:auto}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:26px}.title h1{margin:0;font-size:25px;letter-spacing:-.03em}.title p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer}.btn.primary{background:#fff;color:#0b0d10;border-color:#fff;font-weight:700}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;margin-bottom:22px}.input,.select{width:100%;background:var(--panel);border:1px solid var(--line);color:#fff;padding:10px 12px;border-radius:10px;outline:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s transform,.2s border-color;cursor:pointer}.card:hover{transform:translateY(-2px);border-color:#3a4552}.thumb{height:260px;background:#090b0e;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.count{position:absolute;right:10px;top:10px;background:#0a0d11d9;border:1px solid #ffffff22;padding:5px 8px;border-radius:999px;font-size:12px}.meta{padding:14px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-weight:750;font-size:15px}.status{font-size:11px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:#c9d0d8}.sub{color:var(--muted);font-size:12px;margin-top:7px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.tag{font-size:11px;color:#b9c1cb;background:#1b2128;padding:4px 6px;border-radius:6px}.drawer{position:fixed;inset:0;background:#0009;display:none;align-items:stretch;justify-content:flex-end;z-index:20}.drawer.open{display:flex}.sheet{width:min(920px,94vw);background:#0e1216;border-left:1px solid var(--line);height:100%;overflow:auto;padding:24px}.sheetTop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.sheet h2{margin:0 0 4px;font-size:24px}.muted{color:var(--muted)}.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:22px 0}.slide{background:#080a0d;border:1px solid var(--line);border-radius:10px;overflow:hidden}.slide img{width:100%;display:block}.slideNum{padding:8px 10px;color:var(--muted);font-size:12px}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.section h3{margin:0 0 10px;font-size:14px}.notes{width:100%;min-height:110px;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px;resize:vertical}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:30;padding:20px}.modal.open{display:grid}.modalBox{width:min(620px,100%);background:#11161b;border:1px solid var(--line);border-radius:16px;padding:20px}.modalBox h2{margin:0 0 14px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.urlbox{min-height:120px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:18px 14px 50px}.top{align-items:flex-start}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:10px}.thumb{height:220px}.actions .btn:not(.primary){display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.thumb{height:360px}}</style></head><body><div class="app"><aside class="side"><div class="brand">Creative OS</div><div class="nav"><button class="active">Content Library</button><button>In Review</button><button>Ready to Publish</button><button>Live</button><button>Winners</button><button>Archive</button></div><div class="mini">Internal creative workspace<br>NovaHair / TigerBestBrands</div></aside><main class="main"><div class="top"><div class="title"><h1>Content Library</h1><p>Manage carousels, social assets, notes and publishing status.</p></div><div class="actions"><button class="btn" onclick="sharePage()">Share workspace</button><button class="btn primary" onclick="openAdd()">+ Add creative</button></div></div><div class="toolbar"><input id="search" class="input" placeholder="Search creatives, angles, tags…" oninput="render()"><select id="filter" class="select" onchange="render()"><option value="all">All statuses</option><option>Draft</option><option>Review</option><option>Ready</option><option>Live</option></select><select id="sort" class="select" onchange="render()"><option value="new">Newest first</option><option value="name">Name A–Z</option></select></div><div id="grid" class="grid"></div></main></div><div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div class="sheet"><div class="sheetTop"><div><h2 id="dName"></h2><div id="dSub" class="muted"></div></div><button class="btn" onclick="closeDrawer()">Close</button></div><div id="slides" class="slides"></div><div class="section"><h3>Status</h3><select id="dStatus" class="select" onchange="saveStatus()"><option>Draft</option><option>Review</option><option>Ready</option><option>Live</option></select></div><div class="section"><h3>Notes & feedback</h3><textarea id="dNotes" class="notes" placeholder="Add feedback, revisions, upload notes…" oninput="saveNotes()"></textarea></div><div class="section"><button class="btn" onclick="shareCreative()">Copy share link</button></div></div></div><div id="modal" class="modal"><div class="modalBox"><h2>Add creative</h2><div class="field"><label>Name</label><input id="aName" class="input" placeholder="e.g. Root Cost Carousel"></div><div class="field"><label>Image URLs, one per line</label><textarea id="aUrls" class="notes urlbox" placeholder="https://…\nhttps://…"></textarea></div><div class="field"><label>Tags, comma separated</label><input id="aTags" class="input" placeholder="NovaHair, Instagram, carousel"></div><div class="modalActions"><button class="btn" onclick="closeAdd()">Cancel</button><button class="btn primary" onclick="addCreative()">Add to library</button></div></div></div><script>const defaults=[{id:'sidequest',name:'SideQuest Carousel',platform:'Instagram Carousel',status:'Ready',date:'2026-09-03',tags:['SideQuest','Carousel','Social','Ready'],slides:['https://cdn.creativeclaw.co/u/c6372787/images/cdbc48a6-b8e8-427d-b15e-58f0e5363154.png','https://cdn.creativeclaw.co/u/c6372787/images/bbea0c32-15ab-46a8-b21e-7ddd4d35c1bc.png','https://cdn.creativeclaw.co/u/c6372787/images/d3140f85-753f-4277-b93b-5ecf09c2fa67.png','https://cdn.creativeclaw.co/u/c6372787/images/01a23421-fa72-4793-b1e9-f7737f401dd4.png','https://cdn.creativeclaw.co/u/c6372787/images/67392296-5261-47ba-89a7-8246b0b25fe8.png']},{id:'screen-time',name:'5-Day Experiment',platform:'TikTok / Instagram',status:'Review',date:'2026-09-03',tags:['Photo Mode','UGC','Carousel','Experiment'],slides:['https://cdn.creativeclaw.co/u/c6372787/images/d8c5fe5c-8815-40b0-8a41-b9479901cf97.png','https://cdn.creativeclaw.co/u/c6372787/images/2aa5d60b-ad63-4f8b-8b8c-0a5bb6ff22d9.png','https://cdn.creativeclaw.co/u/c6372787/images/ac1398ba-05fb-40ea-b859-4f2bc03b25aa.png','https://cdn.creativeclaw.co/u/c6372787/images/3193d593-53d2-4105-85b0-43d8b1004af7.png','https://cdn.creativeclaw.co/u/c6372787/images/b83418ab-f2d6-498a-b2f1-09a097a6dd3a.png']}];let creatives=JSON.parse(localStorage.getItem('creative-os-items')||'null')||defaults;let current=null;const notes=JSON.parse(localStorage.getItem('creative-os-notes')||'{}');function persist(){localStorage.setItem('creative-os-items',JSON.stringify(creatives))}function render(){const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;let arr=creatives.filter(c=>(f==='all'||c.status===f)&&([c.name,c.platform,...c.tags].join(' ').toLowerCase().includes(q)));if(document.getElementById('sort').value==='name')arr.sort((a,b)=>a.name.localeCompare(b.name));else arr.sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('grid').innerHTML=arr.length?arr.map(c=>`<article class="card" onclick="openCreative('${c.id}')"><div class="thumb"><img src="${c.slides[0]}"><div class="count">${c.slides.length} slides</div></div><div class="meta"><div class="row"><div class="name">${c.name}</div><span class="status">${c.status}</span></div><div class="sub">${c.platform} · ${c.date}</div><div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></article>`).join(''):'<div class="empty">No creatives match this view.</div>'}function openCreative(id){current=creatives.find(c=>c.id===id);document.getElementById('dName').textContent=current.name;document.getElementById('dSub').textContent=`${current.platform} · ${current.slides.length} slides · ${current.date}`;document.getElementById('dStatus').value=current.status;document.getElementById('dNotes').value=notes[current.id]||'';document.getElementById('slides').innerHTML=current.slides.map((u,i)=>`<div class="slide"><img src="${u}"><div class="slideNum">Slide ${i+1}</div></div>`).join('');document.getElementById('drawer').classList.add('open');history.replaceState(null,'','#'+current.id)}function closeDrawer(){document.getElementById('drawer').classList.remove('open');history.replaceState(null,'',location.pathname)}function saveNotes(){if(!current)return;notes[current.id]=document.getElementById('dNotes').value;localStorage.setItem('creative-os-notes',JSON.stringify(notes))}function saveStatus(){if(!current)return;current.status=document.getElementById('dStatus').value;persist();render()}function shareCreative(){navigator.clipboard.writeText(location.origin+location.pathname+'#'+current.id);alert('Creative link copied')}function sharePage(){navigator.clipboard.writeText(location.href.split('#')[0]);alert('Workspace link copied')}function openAdd(){document.getElementById('modal').classList.add('open')}function closeAdd(){document.getElementById('modal').classList.remove('open')}function addCreative(){const name=document.getElementById('aName').value.trim(),urls=document.getElementById('aUrls').value.split('\n').map(x=>x.trim()).filter(Boolean),tags=document.getElementById('aTags').value.split(',').map(x=>x.trim()).filter(Boolean);if(!name||!urls.length)return alert('Add a name and at least one image URL');creatives.unshift({id:'c-'+Date.now(),name,platform:'Social',status:'Draft',date:new Date().toISOString().slice(0,10),tags,slides:urls});persist();closeAdd();render()}render();if(location.hash){const id=location.hash.slice(1);if(creatives.some(c=>c.id===id))setTimeout(()=>openCreative(id),100)}</script></body></html>
