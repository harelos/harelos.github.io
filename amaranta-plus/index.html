<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amaranta Growth Strategy</title></head>
<body style="margin:0;background:#07070a;color:#fff;font-family:system-ui">
<div id="loading" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">Loading Amaranta strategy…</div>
<script>
fetch('/amaranta/')
  .then(r => { if(!r.ok) throw new Error('Could not load base report'); return r.text(); })
  .then(html => {
    html = html.replace('</head>','<link rel="stylesheet" href="/amaranta-plus/enhancements.css?v=2"></head>');
    html = html.replace('</body>','<script src="/amaranta-plus/enhancements.js?v=2"><\/script></body>');
    document.open(); document.write(html); document.close();
  })
  .catch(err => document.getElementById('loading').textContent='Could not load the report. Please refresh.');
</script>
</body></html>
