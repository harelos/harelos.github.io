<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#050507">
<title>TigerBrands Control Room</title>
<style>
:root{--bg:#050507;--card:#0d0d13;--card2:#12121b;--line:#282838;--txt:#f7f7fb;--muted:#9292a4;--purple:#8b5cf6;--purple2:#c084fc;--red:#ef4444;--green:#22c55e;--amber:#f59e0b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 82% -5%,rgba(139,92,246,.16),transparent 30%),radial-gradient(circle at 0 18%,rgba(239,68,68,.09),transparent 26%),var(--bg);min-height:100vh;overscroll-behavior-x:none}.wrap{width:min(1220px,calc(100% - 24px));margin:auto;padding:18px 0 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.brand h1{margin:0;font-size:clamp(27px,4vw,43px);letter-spacing:-.045em}.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}.live{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#0a0a0e;border-radius:99px;padding:9px 12px;color:#d4d4de;font-size:11px;white-space:nowrap}.dot{width:8px;height:8px;background:var(--purple);border-radius:50%;box-shadow:0 0 16px var(--purple)}
.daynav{margin:18px 0 7px;display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:9px}.navbtn{height:50px;border:1px solid #343448;background:linear-gradient(180deg,#12121a,#0b0b10);color:#fff;border-radius:15px;font-size:29px;line-height:1;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 8px 25px rgba(0,0,0,.25)}.navbtn:active:not(:disabled){transform:scale(.94);background:rgba(139,92,246,.17);border-color:rgba(139,92,246,.6)}.navbtn:disabled{opacity:.18;cursor:default;box-shadow:none}.datebox{text-align:center;border:1px solid var(--line);background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(239,68,68,.06));border-radius:15px;padding:10px 8px;min-height:50px;display:grid;place-items:center}.datebox strong{display:block;font-size:15px}.datebox small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.swipehint{text-align:center;color:#77778a;font-size:10px;margin:5px 0 9px}.daydots{display:flex;justify-content:center;gap:6px;margin-bottom:12px;direction:ltr}.daydot{width:6px;height:6px;border:0;border-radius:50%;padding:0;background:#383848;transition:.18s ease}.daydot.active{width:18px;border-radius:9px;background:linear-gradient(90deg,var(--purple),var(--purple2))}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#09090d;color:#aaaabb;border-radius:11px;padding:10px 13px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}.tab.active{color:#fff;border-color:rgba(139,92,246,.65);background:rgba(139,92,246,.14)}
.deck{position:relative;min-height:260px;overflow:visible}.swipePreview{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:24px;pointer-events:none;opacity:0;transform:scale(.975);transition:opacity .12s ease,transform .12s ease}.previewPill{max-width:86%;padding:10px 15px;border:1px solid rgba(139,92,246,.42);background:rgba(15,12,25,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;color:#ddd6fe;font-size:12px;font-weight:800;box-shadow:0 18px 55px rgba(0,0,0,.38)}.previewPill small{display:block;font-size:9px;font-weight:600;color:#8f8fa3;margin-top:2px}.swipeSurface{position:relative;z-index:2;touch-action:pan-y pinch-zoom;will-change:transform;transform:translate3d(0,0,0) rotate(0deg);transform-origin:50% 15%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.swipeSurface.dragging{filter:drop-shadow(0 22px 34px rgba(0,0,0,.25))}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px}.card{background:linear-gradient(180deg,rgba(17,17,25,.97),rgba(9,9,13,.97));border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 15px 45px rgba(0,0,0,.18)}.metric{grid-column:span 3;min-height:130px}.wide{grid-column:span 6}.full{grid-column:1/-1}.label{color:var(--muted);font-size:11px}.value{font-size:clamp(27px,3.2vw,39px);font-weight:850;letter-spacing:-.04em;margin-top:10px}.sub{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.45}.status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800;margin-top:9px}.status.strong{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.26);color:#86efac}.status.watch{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.25);color:#fcd34d}.status.weak{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.26);color:#fda4af}.status.sample{background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.25);color:#c4b5fd}.title{font-size:15px;margin:0 0 13px}.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage{background:#09090d;border:1px solid #22222d;border-radius:14px;padding:12px}.stage strong{font-size:23px;display:block}.stage span{font-size:10px;color:var(--muted);display:block;margin-top:4px}.stage .rate{font-size:13px;color:#ddd;margin-top:9px}.bar{height:6px;border-radius:9px;background:#1c1c26;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:inherit}.healthrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #20202b}.healthrow:last-child{border-bottom:0}.healthname b{font-size:13px}.healthname small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.healthval{text-align:left}.healthval strong{font-size:20px}.campaign{padding:14px 0;border-bottom:1px solid #20202b}.campaign:last-child{border-bottom:0}.campaigntop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cname{font-size:14px;font-weight:800}.cfull{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.badge{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:850;white-space:nowrap}.badge.active{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);color:#c4b5fd}.badge.paused{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fecaca}.badge.history{background:#111118;border:1px solid #292936;color:#aaaaba}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.stat{background:#09090d;border:1px solid #20202a;border-radius:11px;padding:9px}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{display:block;margin-top:4px;font-size:13px}.advisorline{margin-top:10px;border-right:3px solid var(--purple);background:rgba(139,92,246,.06);padding:10px 11px;border-radius:9px;color:#c9c9d2;font-size:11px;line-height:1.6}.heroAdvice{position:relative;overflow:hidden}.heroAdvice:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;left:-65px;top:-75px;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 67%)}.verdict{display:inline-flex;padding:6px 9px;border-radius:99px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.25);color:#fda4af;font-size:10px;font-weight:900}.heroAdvice h2{font-size:22px;margin:13px 0 8px;letter-spacing:-.02em}.heroAdvice p{color:#b9b9c5;line-height:1.7;font-size:13px;margin:0;max-width:850px}.warning{border-color:rgba(239,68,68,.28);background:linear-gradient(180deg,rgba(45,10,17,.32),rgba(12,9,13,.95))}.rules{margin:0;padding:0;counter-reset:r}.rules li{list-style:none;counter-increment:r;position:relative;padding:13px 46px 13px 12px;border-bottom:1px solid #20202b;color:#c5c5cf;font-size:12px;line-height:1.6}.rules li:last-child{border-bottom:0}.rules li:before{content:counter(r);position:absolute;right:8px;top:11px;width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:#c4b5fd;font-weight:900}.log{display:grid;grid-template-columns:110px 1fr 2fr;gap:10px;padding:12px 0;border-bottom:1px solid #20202b}.log:last-child{border-bottom:0}.log small{color:var(--muted)}.log b{font-size:12px}.log span{font-size:11px;color:#b4b4bf;line-height:1.5}.note{font-size:11px;color:#9292a4;line-height:1.6;border:1px dashed #2b2b39;border-radius:12px;padding:11px;margin-top:11px}.footer{text-align:center;color:#5f5f70;font-size:10px;margin-top:24px}.edgeNav{position:fixed;z-index:60;top:54%;transform:translateY(-50%);width:40px;height:72px;border:1px solid rgba(139,92,246,.28);background:rgba(10,10,15,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:28px;display:none;place-items:center;box-shadow:0 12px 35px rgba(0,0,0,.32);-webkit-tap-highlight-color:transparent;touch-action:manipulation}.edgeNav.left{left:0;border-radius:0 18px 18px 0;border-left:0}.edgeNav.right{right:0;border-radius:18px 0 0 18px;border-right:0}.edgeNav:active:not(:disabled){background:rgba(139,92,246,.24)}.edgeNav:disabled{opacity:.12;pointer-events:none}
@media(max-width:900px){.metric{grid-column:span 6}.wide{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}.funnel{grid-template-columns:1fr 1fr}.top{flex-direction:column}.live{align-self:flex-start}.log{grid-template-columns:1fr}.edgeNav{display:grid}}
@media(max-width:520px){.wrap{width:calc(100% - 18px);padding-top:12px}.metric{padding:12px;min-height:118px}.value{font-size:29px}.card{border-radius:14px}.stats{grid-template-columns:1fr 1fr}.brand h1{font-size:30px}.funnel{grid-template-columns:1fr 1fr}.daynav{grid-template-columns:52px 1fr 52px}.navbtn{height:50px}.edgeNav{width:32px;height:66px;font-size:24px;opacity:.9}.swipePreview{padding-top:14px}}
</style>
</head>
<body>
<button class="edgeNav left" id="edgeNewer" aria-label="יום חדש יותר">‹</button>
<button class="edgeNav right" id="edgeOlder" aria-label="יום ישן יותר">›</button>
<main class="wrap" id="app">
<header class="top"><div class="brand"><h1>Control Room</h1><p>TigerBrands · Meta + Shopify · decision-first</p></div><div class="live"><span class="dot"></span><span id="updated">טוען…</span></div></header>
<div class="daynav"><button class="navbtn" id="newer" aria-label="יום חדש יותר">‹</button><div class="datebox"><div><strong id="dateLabel">—</strong><small id="dateMeta">—</small></div></div><button class="navbtn" id="older" aria-label="יום ישן יותר">›</button></div>
<div class="swipehint">תפוס את אזור הנתונים וגרור · שחרור קצר מחזיר למקום</div>
<div class="daydots" id="dayDots" aria-hidden="true"></div>
<nav class="tabs"><button class="tab active" data-tab="overview">מצב</button><button class="tab" data-tab="campaigns">קמפיינים</button><button class="tab" data-tab="health">זה טוב?</button><button class="tab" data-tab="advisor">Advisor</button><button class="tab" data-tab="guard">Decision Guard</button><button class="tab" data-tab="log">יומן</button></nav>
<div class="deck" id="deck"><div class="swipePreview" id="swipePreview"><div class="previewPill" id="previewPill">—</div></div><div class="swipeSurface" id="swipeSurface">
<section id="overview" class="section active"><div id="overviewContent" class="grid"></div></section>
<section id="campaigns" class="section"><div id="campaignContent"></div></section>
<section id="health" class="section"><div id="healthContent" class="grid"></div></section>
<section id="advisor" class="section"><div id="advisorContent" class="grid"></div></section>
<section id="guard" class="section"><div id="guardContent" class="grid"></div></section>
<section id="log" class="section"><div id="logContent" class="grid"></div></section>
</div></div><div class="footer">GitHub Pages · manual data sync until direct API integration</div></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let DATA=null,dates=[],selected=null,animating=false;
const money=n=>n==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n),num=n=>n==null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n),pct=n=>n==null?'—':`${num(n)}%`,ratio=(a,b)=>b?100*a/b:0;
function clsStatus(s){if(s==='ACTIVE')return'active';if(s==='PAUSED')return'paused';return'history'}function statusLabel(s){return s==='ACTIVE'?'ACTIVE':s==='PAUSED'?'PAUSED':s==='STARTED_LATE'?'STARTED LATE':'HISTORICAL'}function health(key,val,denom=99){const t=DATA.operatingThresholds[key];if(denom<5)return{c:'sample',txt:'מעט דאטה'};if(val>=t.strong)return{c:'strong',txt:'חזק'};if(val>=t.watch)return{c:'watch',txt:'סביר / מעקב'};return{c:'weak',txt:'חלש'}}function roasHealth(v){const t=DATA.operatingThresholds.roasSignal;if(v>=t.strong)return{c:'strong',txt:'חזק יחסית'};if(v>=t.watch)return{c:'watch',txt:'ביניים'};return{c:'weak',txt:'חלש יחסית'}}function statusPill(h){return`<span class="status ${h.c}">${h.txt}</span>`}function metric(label,value,sub='',h=null){return`<article class="card metric"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}${h?statusPill(h):''}</article>`}function stage(name,count,ratev){return`<div class="stage"><strong>${num(count)}</strong><span>${name}</span><div class="rate">${pct(ratev)}</div><div class="bar"><i style="width:${Math.min(100,Math.max(3,ratev))}%"></i></div></div>`}function day(){return DATA.days[selected]}function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
function render(){if(!DATA||!selected)return;const d=day(),m=d.metaAds,s=d.shopify,idx=dates.indexOf(selected);$('#older').disabled=$('#edgeOlder').disabled=idx===0;$('#newer').disabled=$('#edgeNewer').disabled=idx===dates.length-1;$('#dateLabel').textContent=fmtDate(selected);$('#dateMeta').textContent=selected===dates.at(-1)?'היום / snapshot אחרון':'snapshot היסטורי';$('#dayDots').innerHTML=dates.map(x=>`<i class="daydot ${x===selected?'active':''}"></i>`).join('');const lpvAtc=ratio(m.addToCarts,m.landingPageViews),atcChk=ratio(m.initiateCheckouts,m.addToCarts),chkPur=ratio(m.purchases,m.initiateCheckouts),lpvPur=ratio(m.purchases,m.landingPageViews);
$('#overviewContent').innerHTML=metric('Spend',money(m.spend),'Meta spend')+metric('ROAS',num(m.roas),'Signal only — profitability needs break-even target',roasHealth(m.roas))+metric('Purchases',num(m.purchases),'Meta attributed')+metric('Shopify CVR',pct(s.conversionRate),'Storewide')+metric('LPV',num(m.landingPageViews),money(m.costPerLandingPageView)+' / LPV')+metric('ATC',num(m.addToCarts),money(m.costPerAddToCart)+' / ATC',health('lpvToAtc',lpvAtc,m.landingPageViews))+metric('Checkout',num(m.initiateCheckouts),money(m.costPerCheckout)+' / checkout',health('atcToCheckout',atcChk,m.addToCarts))+metric('CPA',money(m.costPerPurchase),'Meta attributed')+`<article class="card wide"><h2 class="title">Paid funnel</h2><div class="funnel">${stage('LPV',m.landingPageViews,100)}${stage('LPV → ATC',m.addToCarts,lpvAtc)}${stage('ATC → Checkout',m.initiateCheckouts,atcChk)}${stage('Checkout → Purchase',m.purchases,chkPur)}</div></article><article class="card wide heroAdvice"><span class="verdict">${d.advisor.verdict}</span><h2>${d.advisor.headline}</h2><p>${d.advisor.body}</p></article>`;
$('#campaignContent').innerHTML=`<article class="card full"><h2 class="title">Campaign performance — ${selected}</h2>${d.campaigns.map(c=>{const a=ratio(c.addToCarts,c.landingPageViews),q=ratio(c.checkouts,c.addToCarts),p=ratio(c.purchases,c.checkouts);return`<div class="campaign"><div class="campaigntop"><div><div class="cname">${c.shortName}</div><div class="cfull">${c.name}</div></div><span class="badge ${clsStatus(c.status)}">${statusLabel(c.status)}</span></div><div class="stats"><div class="stat"><small>Budget</small><b>${money(c.dailyBudget)}</b></div><div class="stat"><small>Spend</small><b>${money(c.spend)}</b></div><div class="stat"><small>LPV</small><b>${num(c.landingPageViews)}</b></div><div class="stat"><small>ATC</small><b>${num(c.addToCarts)}</b></div><div class="stat"><small>Checkout</small><b>${num(c.checkouts)}</b></div><div class="stat"><small>ROAS</small><b>${num(c.roas)}</b></div></div><div class="stats"><div class="stat"><small>LPV→ATC</small><b>${pct(a)}</b>${statusPill(health('lpvToAtc',a,c.landingPageViews))}</div><div class="stat"><small>ATC→Checkout</small><b>${pct(q)}</b>${statusPill(health('atcToCheckout',q,c.addToCarts))}</div><div class="stat"><small>Checkout→Purchase</small><b>${pct(p)}</b>${statusPill(health('checkoutToPurchase',p,c.checkouts))}</div></div><div class="advisorline">${c.advisor}</div></div>`}).join('')}</article>`;
const hs=[['lpvToAtc',lpvAtc,m.landingPageViews,'האם הלנדינג מייצר רצון להוסיף לסל'],['atcToCheckout',atcChk,m.addToCarts,'האם מי שהוסיף לסל מתקדם לתשלום'],['checkoutToPurchase',chkPur,m.initiateCheckouts,'האם checkout נסגר לרכישה'],['lpvToPurchase',lpvPur,m.landingPageViews,'Conversion של paid landing traffic']];$('#healthContent').innerHTML=`<article class="card wide"><h2 class="title">Funnel Health — תשובה ל״זה טוב?״</h2>${hs.map(x=>{const h=health(x[0],x[1],x[2]);return`<div class="healthrow"><div class="healthname"><b>${DATA.operatingThresholds[x[0]].label}</b><small>${x[3]}</small></div><div class="healthval"><strong>${pct(x[1])}</strong>${statusPill(h)}</div></div>`}).join('')}</article><article class="card wide"><h2 class="title">איך לקרוא את הצבעים</h2><div class="advisorline">ירוק = חזק לפי ספי העבודה של החשבון הזה. צהוב = סביר אבל לא מספיק כדי לשנות מבנה. אדום = חולשה שדורשת בדיקה, לא בהכרח כיבוי אוטומטי. סגול = sample קטן מדי.</div><div class="note">${DATA.operatingThresholds.note}</div><div class="note">${DATA.financialTargets.note}</div></article>`;$('#advisorContent').innerHTML=`<article class="card full heroAdvice"><span class="verdict">${d.advisor.verdict}</span><h2>${d.advisor.headline}</h2><p>${d.advisor.body}</p></article><article class="card full"><h2 class="title">Advisor rule</h2><div class="advisorline">כל הצעה עוברת קודם KEEP / CHANGE / STOP ונבדקת מול rolling 3-day, sample size, cash risk וכמות השינויים שכבר נעשו.</div></article>`;$('#guardContent').innerHTML=`<article class="card wide"><h2 class="title">${DATA.decisionPolicy.headline}</h2><ol class="rules">${DATA.decisionPolicy.rules.map(r=>`<li>${r}</li>`).join('')}</ol></article><article class="card wide warning"><h2 class="title">Stop-loss logic</h2><ol class="rules">${DATA.decisionPolicy.stopLossLogic.map(r=>`<li>${r}</li>`).join('')}</ol></article>`;$('#logContent').innerHTML=`<article class="card full"><h2 class="title">Decision log</h2>${DATA.decisionLog.map(x=>`<div class="log"><small>${x.date}</small><b>${x.action}</b><span>${x.assessment}</span></div>`).join('')}</article>`}
function targetFor(dx){const i=dates.indexOf(selected),n=i+(dx<0?1:-1);return n>=0&&n<dates.length?dates[n]:null}function showPreview(dx){const target=targetFor(dx),p=$('#swipePreview');if(!target){p.style.opacity='0';return}const amount=Math.min(1,Math.abs(dx)/110);$('#previewPill').innerHTML=`${dx>0?'← יום קודם':'יום הבא →'}<small>${fmtDate(target)}</small>`;p.style.opacity=String(.18+.82*amount);p.style.transform=`scale(${.975+.025*amount})`}function resetCard(){const s=$('#swipeSurface'),p=$('#swipePreview');s.style.transition='transform .24s cubic-bezier(.22,.8,.24,1),opacity .2s ease';s.style.transform='translate3d(0,0,0) rotate(0deg)';s.style.opacity='1';s.classList.remove('dragging');p.style.opacity='0';p.style.transform='scale(.975)'}function commitSwipe(dx){const target=targetFor(dx);if(!target){resetCard();return}animating=true;const s=$('#swipeSurface'),w=Math.max(innerWidth,420),dir=dx>0?1:-1;s.style.transition='transform .22s cubic-bezier(.2,.72,.25,1),opacity .18s ease';s.style.transform=`translate3d(${dir*w*1.12}px,-8px,0) rotate(${dir*5}deg)`;s.style.opacity='.16';setTimeout(()=>{selected=target;render();s.style.transition='none';s.style.transform=`translate3d(${-dir*Math.min(w*.34,170)}px,0,0) rotate(${-dir*1.8}deg)`;s.style.opacity='.55';$('#swipePreview').style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transition='transform .25s cubic-bezier(.18,.82,.24,1),opacity .2s ease';s.style.transform='translate3d(0,0,0) rotate(0deg)';s.style.opacity='1';s.classList.remove('dragging');animating=false}))},205);try{navigator.vibrate&&navigator.vibrate(9)}catch(_){}}function move(dir){if(animating)return;const i=dates.indexOf(selected),n=i+dir;if(n<0||n>=dates.length)return;commitSwipe(dir>0?-120:120)}
const surface=$('#swipeSurface');let g=null;surface.addEventListener('touchstart',e=>{if(animating||e.touches.length!==1)return;const t=e.touches[0];g={x:t.clientX,y:t.clientY,lastX:t.clientX,lastY:t.clientY,time:performance.now(),axis:null};surface.style.transition='none'},{passive:true});surface.addEventListener('touchmove',e=>{if(!g||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;g.lastX=t.clientX;g.lastY=t.clientY;if(!g.axis){if(Math.abs(dx)<4&&Math.abs(dy)<4)return;if(Math.abs(dx)>Math.abs(dy)*.78)g.axis='x';else if(Math.abs(dy)>Math.abs(dx)*1.18)g.axis='y';else return}if(g.axis!=='x')return;e.preventDefault();const target=targetFor(dx),edgeResistance=target?1:.22,drag=dx*edgeResistance,rot=Math.max(-3.2,Math.min(3.2,drag/65));surface.classList.add('dragging');surface.style.transform=`translate3d(${drag}px,0,0) rotate(${rot}deg)`;surface.style.opacity=String(Math.max(.82,1-Math.abs(drag)/900));showPreview(drag)},{passive:false});function touchEnd(e){if(!g)return;const t=e.changedTouches&&e.changedTouches[0],x=t?t.clientX:g.lastX,y=t?t.clientY:g.lastY,dx=x-g.x,dy=y-g.y,dt=Math.max(1,performance.now()-g.time),vx=Math.abs(dx)/dt,axis=g.axis;g=null;if(axis!=='x'){resetCard();return}const threshold=Math.min(92,Math.max(54,innerWidth*.18)),horizontal=Math.abs(dx)>Math.abs(dy)*.75;if(horizontal&&(Math.abs(dx)>=threshold||vx>=.48)&&targetFor(dx))commitSwipe(dx);else resetCard()}surface.addEventListener('touchend',touchEnd,{passive:true});surface.addEventListener('touchcancel',()=>{g=null;resetCard()},{passive:true});
let mouse=null;surface.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||animating)return;mouse={x:e.clientX,y:e.clientY,time:performance.now()};surface.setPointerCapture?.(e.pointerId);surface.style.transition='none'});surface.addEventListener('pointermove',e=>{if(!mouse)return;const dx=e.clientX-mouse.x;surface.classList.add('dragging');surface.style.transform=`translate3d(${dx}px,0,0) rotate(${Math.max(-3,Math.min(3,dx/70))}deg)`;showPreview(dx)});surface.addEventListener('pointerup',e=>{if(!mouse)return;const dx=e.clientX-mouse.x,dt=Math.max(1,performance.now()-mouse.time),v=Math.abs(dx)/dt;mouse=null;if((Math.abs(dx)>70||v>.5)&&targetFor(dx))commitSwipe(dx);else resetCard()});$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');resetCard()});$('#older').onclick=$('#edgeOlder').onclick=()=>move(-1);$('#newer').onclick=$('#edgeNewer').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(-1);if(e.key==='ArrowLeft')move(1)});async function load(first=false){try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});DATA=await r.json();dates=Object.keys(DATA.days).sort();if(first||!dates.includes(selected))selected=dates.at(-1);const t=new Date(DATA.meta.lastUpdated);$('#updated').textContent='עודכן '+t.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' ישראל';render()}catch(e){$('#updated').textContent='שגיאת sync'}}load(true);setInterval(()=>load(false),30000);
