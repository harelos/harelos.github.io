<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>TigerBrands Control Room</title>
<style>
:root{--bg:#050507;--card:#0d0d13;--line:#282838;--txt:#f7f7fb;--muted:#9292a4;--purple:#8b5cf6;--purple2:#c084fc;--red:#ef4444;--green:#22c55e;--amber:#f59e0b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 82% -5%,rgba(139,92,246,.16),transparent 30%),radial-gradient(circle at 0 18%,rgba(239,68,68,.09),transparent 26%),var(--bg);min-height:100vh;overscroll-behavior-x:none}.wrap{width:min(1220px,calc(100% - 24px));margin:auto;padding:18px 0 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.brand h1{margin:0;font-size:clamp(27px,4vw,43px);letter-spacing:-.045em}.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}.live{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#0a0a0e;border-radius:99px;padding:9px 12px;color:#d4d4de;font-size:11px;white-space:nowrap}.dot{width:8px;height:8px;background:var(--purple);border-radius:50%;box-shadow:0 0 16px var(--purple)}
.daynav{margin:18px 0 7px;display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:9px;position:relative}.navbtn{height:50px;border:1px solid #343448;background:linear-gradient(180deg,#12121a,#0b0b10);color:#fff;border-radius:15px;font-size:29px;line-height:1;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 8px 25px rgba(0,0,0,.25)}.navbtn:active:not(:disabled){transform:scale(.94);background:rgba(139,92,246,.17);border-color:rgba(139,92,246,.6)}.navbtn:disabled{opacity:.18;cursor:default;box-shadow:none}.datebox{text-align:center;border:1px solid var(--line);background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(239,68,68,.06));border-radius:15px;padding:10px 8px;min-height:50px;display:grid;place-items:center}.datebox strong{display:block;font-size:15px}.datebox small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.swipehint{text-align:center;color:#77778a;font-size:10px;margin:5px 0 9px}.daydots{display:flex;justify-content:center;gap:6px;margin-bottom:12px;direction:ltr}.daydot{width:6px;height:6px;border:0;border-radius:50%;padding:0;background:#383848;transition:.18s ease}.daydot.active{width:18px;border-radius:9px;background:linear-gradient(90deg,var(--purple),var(--purple2))}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#09090d;color:#aaaabb;border-radius:11px;padding:10px 13px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}.tab.active{color:#fff;border-color:rgba(139,92,246,.65);background:rgba(139,92,246,.14)}
#swipeZone{touch-action:pan-y;will-change:transform;transform:translate3d(0,0,0);transition:transform .18s cubic-bezier(.22,.75,.28,1),opacity .18s ease;min-height:250px}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px}.card{background:linear-gradient(180deg,rgba(17,17,25,.97),rgba(9,9,13,.97));border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 15px 45px rgba(0,0,0,.18)}.metric{grid-column:span 3;min-height:130px}.wide{grid-column:span 6}.full{grid-column:1/-1}.label{color:var(--muted);font-size:11px}.value{font-size:clamp(27px,3.2vw,39px);font-weight:850;letter-spacing:-.04em;margin-top:10px}.sub{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.45}.status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800;margin-top:9px}.status.strong{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.26);color:#86efac}.status.watch{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.25);color:#fcd34d}.status.weak{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.26);color:#fda4af}.status.sample{background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.25);color:#c4b5fd}.title{font-size:15px;margin:0 0 13px}.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage{background:#09090d;border:1px solid #22222d;border-radius:14px;padding:12px}.stage strong{font-size:23px;display:block}.stage span{font-size:10px;color:var(--muted);display:block;margin-top:4px}.stage .rate{font-size:13px;color:#ddd;margin-top:9px}.bar{height:6px;border-radius:9px;background:#1c1c26;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:inherit}.healthrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #20202b}.healthrow:last-child{border-bottom:0}.healthname b{font-size:13px}.healthname small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.healthval{text-align:left}.healthval strong{font-size:20px}.campaign{padding:14px 0;border-bottom:1px solid #20202b}.campaign:last-child{border-bottom:0}.campaigntop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cname{font-size:14px;font-weight:800}.cfull{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.badge{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:850;white-space:nowrap}.badge.active{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);color:#c4b5fd}.badge.paused{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fecaca}.badge.history{background:#111118;border:1px solid #292936;color:#aaaaba}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.stat{background:#09090d;border:1px solid #20202a;border-radius:11px;padding:9px}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{display:block;margin-top:4px;font-size:13px}.advisorline{margin-top:10px;border-right:3px solid var(--purple);background:rgba(139,92,246,.06);padding:10px 11px;border-radius:9px;color:#c9c9d2;font-size:11px;line-height:1.6}.heroAdvice{position:relative;overflow:hidden}.heroAdvice:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;left:-65px;top:-75px;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 67%)}.verdict{display:inline-flex;padding:6px 9px;border-radius:99px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.25);color:#fda4af;font-size:10px;font-weight:900}.heroAdvice h2{font-size:22px;margin:13px 0 8px;letter-spacing:-.02em}.heroAdvice p{color:#b9b9c5;line-height:1.7;font-size:13px;margin:0;max-width:850px}.warning{border-color:rgba(239,68,68,.28);background:linear-gradient(180deg,rgba(45,10,17,.32),rgba(12,9,13,.95))}.rules{margin:0;padding:0;counter-reset:r}.rules li{list-style:none;counter-increment:r;position:relative;padding:13px 46px 13px 12px;border-bottom:1px solid #20202b;color:#c5c5cf;font-size:12px;line-height:1.6}.rules li:last-child{border-bottom:0}.rules li:before{content:counter(r);position:absolute;right:8px;top:11px;width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:#c4b5fd;font-weight:900}.log{display:grid;grid-template-columns:110px 1fr 2fr;gap:10px;padding:12px 0;border-bottom:1px solid #20202b}.log:last-child{border-bottom:0}.log small{color:var(--muted)}.log b{font-size:12px}.log span{font-size:11px;color:#b4b4bf;line-height:1.5}.note{font-size:11px;color:#9292a4;line-height:1.6;border:1px dashed #2b2b39;border-radius:12px;padding:11px;margin-top:11px}.footer{text-align:center;color:#5f5f70;font-size:10px;margin-top:24px}
.edgeNav{position:fixed;z-index:50;top:52%;transform:translateY(-50%);width:42px;height:74px;border:1px solid rgba(139,92,246,.28);background:rgba(10,10,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:28px;display:none;place-items:center;box-shadow:0 12px 35px rgba(0,0,0,.32);-webkit-tap-highlight-color:transparent;touch-action:manipulation}.edgeNav.left{left:0;border-radius:0 18px 18px 0;border-left:0}.edgeNav.right{right:0;border-radius:18px 0 0 18px;border-right:0}.edgeNav:active:not(:disabled){background:rgba(139,92,246,.24)}.edgeNav:disabled{opacity:.12;pointer-events:none}
@media(max-width:900px){.metric{grid-column:span 6}.wide{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}.funnel{grid-template-columns:1fr 1fr}.top{flex-direction:column}.live{align-self:flex-start}.log{grid-template-columns:1fr}.edgeNav{display:grid}}
@media(max-width:520px){.wrap{width:calc(100% - 18px);padding-top:12px}.metric{padding:12px;min-height:118px}.value{font-size:29px}.card{border-radius:14px}.stats{grid-template-columns:1fr 1fr}.brand h1{font-size:30px}.funnel{grid-template-columns:1fr 1fr}.daynav{grid-template-columns:52px 1fr 52px}.navbtn{height:50px}.edgeNav{width:34px;height:68px;font-size:24px;opacity:.88}}
</style>
</head>
<body>
<button class="edgeNav left" id="edgeNewer" aria-label="יום חדש יותר">‹</button>
<button class="edgeNav right" id="edgeOlder" aria-label="יום ישן יותר">›</button>
<main class="wrap" id="app">
<header class="top"><div class="brand"><h1>Control Room</h1><p>TigerBrands · Meta + Shopify · decision-first</p></div><div class="live"><span class="dot"></span><span id="updated">טוען…</span></div></header>
<div class="daynav"><button class="navbtn" id="newer" aria-label="יום חדש יותר">‹</button><div class="datebox"><div><strong id="dateLabel">—</strong><small id="dateMeta">—</small></div></div><button class="navbtn" id="older" aria-label="יום ישן יותר">›</button></div>
<div class="swipehint">החלק על הכרטיסים ימינה/שמאלה · או השתמש בחצים</div>
<div class="daydots" id="dayDots" aria-hidden="true"></div>
<nav class="tabs"><button class="tab active" data-tab="overview">מצב</button><button class="tab" data-tab="campaigns">קמפיינים</button><button class="tab" data-tab="health">זה טוב?</button><button class="tab" data-tab="advisor">Advisor</button><button class="tab" data-tab="guard">Decision Guard</button><button class="tab" data-tab="log">יומן</button></nav>
<div id="swipeZone">
<section id="overview" class="section active"><div id="overviewContent" class="grid"></div></section>
<section id="campaigns" class="section"><div id="campaignContent"></div></section>
<section id="health" class="section"><div id="healthContent" class="grid"></div></section>
<section id="advisor" class="section"><div id="advisorContent" class="grid"></div></section>
<section id="guard" class="section"><div id="guardContent" class="grid"></div></section>
<section id="log" class="section"><div id="logContent" class="grid"></div></section>
</div>
<div class="footer">GitHub Pages · manual data sync until direct API integration</div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let DATA=null,dates=[],selected=null;
const money=n=>n==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n);
const num=n=>n==null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n);
const pct=n=>n==null?'—':`${num(n)}%`;
const ratio=(a,b)=>b?100*a/b:0;
function clsStatus(s){if(s==='ACTIVE')return 'active';if(s==='PAUSED')return 'paused';return 'history'}
function statusLabel(s){return s==='ACTIVE'?'ACTIVE':s==='PAUSED'?'PAUSED':s==='STARTED_LATE'?'STARTED LATE':'HISTORICAL'}
function health(key,val,denom=99){const t=DATA.operatingThresholds[key];if(denom<5)return {c:'sample',txt:'מעט דאטה'};if(val>=t.strong)return {c:'strong',txt:'חזק'};if(val>=t.watch)return {c:'watch',txt:'סביר / מעקב'};return {c:'weak',txt:'חלש'}}
function roasHealth(v){if(v>=DATA.operatingThresholds.roasSignal.strong)return {c:'strong',txt:'חזק יחסית'};if(v>=DATA.operatingThresholds.roasSignal.watch)return {c:'watch',txt:'ביניים'};return {c:'weak',txt:'חלש יחסית'}}
function statusPill(h){return `<span class="status ${h.c}">${h.txt}</span>`}
function metric(label,value,sub='',h=null){return `<article class="card metric"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}${h?statusPill(h):''}</article>`}
function stage(name,count,ratev){return `<div class="stage"><strong>${num(count)}</strong><span>${name}</span><div class="rate">${pct(ratev)}</div><div class="bar"><i style="width:${Math.min(100,Math.max(3,ratev))}%"></i></div></div>`}
function day(){return DATA.days[selected]}
function renderDots(){const i=dates.indexOf(selected);$('#dayDots').innerHTML=dates.map((_,n)=>`<i class="daydot ${n===i?'active':''}"></i>`).join('')}
function render(){if(!DATA||!selected)return;const d=day(),m=d.metaAds,s=d.shopify,idx=dates.indexOf(selected);const atOldest=idx===0,atNewest=idx===dates.length-1;$('#older').disabled=atOldest;$('#edgeOlder').disabled=atOldest;$('#newer').disabled=atNewest;$('#edgeNewer').disabled=atNewest;renderDots();const dt=new Date(selected+'T12:00:00');$('#dateLabel').textContent=dt.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});$('#dateMeta').textContent=atNewest?'היום / snapshot אחרון':'snapshot היסטורי';
const lpvAtc=ratio(m.addToCarts,m.landingPageViews),atcChk=ratio(m.initiateCheckouts,m.addToCarts),chkPur=ratio(m.purchases,m.initiateCheckouts),lpvPur=ratio(m.purchases,m.landingPageViews);
$('#overviewContent').innerHTML=metric('Spend',money(m.spend),'Meta spend')+metric('ROAS',num(m.roas),'Signal only — profitability needs break-even target',roasHealth(m.roas))+metric('Purchases',num(m.purchases),'Meta attributed')+metric('Shopify CVR',pct(s.conversionRate),'Storewide')+metric('LPV',num(m.landingPageViews),money(m.costPerLandingPageView)+' / LPV')+metric('ATC',num(m.addToCarts),money(m.costPerAddToCart)+' / ATC',health('lpvToAtc',lpvAtc,m.landingPageViews))+metric('Checkout',num(m.initiateCheckouts),money(m.costPerCheckout)+' / checkout',health('atcToCheckout',atcChk,m.addToCarts))+metric('CPA',money(m.costPerPurchase),'Meta attributed')+`<article class="card wide"><h2 class="title">Paid funnel</h2><div class="funnel">${stage('LPV',m.landingPageViews,100)}${stage('LPV → ATC',m.addToCarts,lpvAtc)}${stage('ATC → Checkout',m.initiateCheckouts,atcChk)}${stage('Checkout → Purchase',m.purchases,chkPur)}</div></article>`+`<article class="card wide heroAdvice"><span class="verdict">${d.advisor.verdict}</span><h2>${d.advisor.headline}</h2><p>${d.advisor.body}</p></article>`;
$('#campaignContent').innerHTML=`<article class="card full"><h2 class="title">Campaign performance — ${selected}</h2>${d.campaigns.map(c=>{const a=ratio(c.addToCarts,c.landingPageViews),q=ratio(c.checkouts,c.addToCarts),p=ratio(c.purchases,c.checkouts);return `<div class="campaign"><div class="campaigntop"><div><div class="cname">${c.shortName}</div><div class="cfull">${c.name}</div></div><span class="badge ${clsStatus(c.status)}">${statusLabel(c.status)}</span></div><div class="stats"><div class="stat"><small>Budget</small><b>${money(c.dailyBudget)}</b></div><div class="stat"><small>Spend</small><b>${money(c.spend)}</b></div><div class="stat"><small>LPV</small><b>${num(c.landingPageViews)}</b></div><div class="stat"><small>ATC</small><b>${num(c.addToCarts)}</b></div><div class="stat"><small>Checkout</small><b>${num(c.checkouts)}</b></div><div class="stat"><small>ROAS</small><b>${num(c.roas)}</b></div></div><div class="stats"><div class="stat"><small>LPV→ATC</small><b>${pct(a)}</b>${statusPill(health('lpvToAtc',a,c.landingPageViews))}</div><div class="stat"><small>ATC→Checkout</small><b>${pct(q)}</b>${statusPill(health('atcToCheckout',q,c.addToCarts))}</div><div class="stat"><small>Checkout→Purchase</small><b>${pct(p)}</b>${statusPill(health('checkoutToPurchase',p,c.checkouts))}</div></div><div class="advisorline">${c.advisor}</div></div>`}).join('')}</article>`;
const hs=[['lpvToAtc',lpvAtc,m.landingPageViews,'האם הלנדינג מייצר רצון להוסיף לסל'],['atcToCheckout',atcChk,m.addToCarts,'האם מי שהוסיף לסל מתקדם לתשלום'],['checkoutToPurchase',chkPur,m.initiateCheckouts,'האם checkout נסגר לרכישה'],['lpvToPurchase',lpvPur,m.landingPageViews,'Conversion של paid landing traffic']];
$('#healthContent').innerHTML=`<article class="card wide"><h2 class="title">Funnel Health — תשובה ל״זה טוב?״</h2>${hs.map(x=>{const h=health(x[0],x[1],x[2]);return `<div class="healthrow"><div class="healthname"><b>${DATA.operatingThresholds[x[0]].label}</b><small>${x[3]}</small></div><div class="healthval"><strong>${pct(x[1])}</strong>${statusPill(h)}</div></div>`}).join('')}</article><article class="card wide"><h2 class="title">איך לקרוא את הצבעים</h2><div class="advisorline">ירוק = חזק לפי ספי העבודה של החשבון הזה. צהוב = סביר אבל לא מספיק כדי לשנות מבנה. אדום = חולשה שדורשת בדיקה, לא בהכרח כיבוי אוטומטי. סגול = sample קטן מדי.</div><div class="note">${DATA.operatingThresholds.note}</div><div class="note">${DATA.financialTargets.note}</div></article>`;
$('#advisorContent').innerHTML=`<article class="card full heroAdvice"><span class="verdict">${d.advisor.verdict}</span><h2>${d.advisor.headline}</h2><p>${d.advisor.body}</p></article><article class="card full"><h2 class="title">Advisor rule</h2><div class="advisorline">אני לא אמור להסכים עם הצעה רק כי היא נשמעת משכנעת. כל הצעה מסווגת קודם כ־KEEP / CHANGE / STOP, ונבדקת מול rolling 3-day, sample size, cash risk וכמות השינויים שכבר נעשו.</div></article>`;
$('#guardContent').innerHTML=`<article class="card wide"><h2 class="title">${DATA.decisionPolicy.headline}</h2><ol class="rules">${DATA.decisionPolicy.rules.map(r=>`<li>${r}</li>`).join('')}</ol></article><article class="card wide warning"><h2 class="title">Stop-loss logic</h2><ol class="rules">${DATA.decisionPolicy.stopLossLogic.map(r=>`<li>${r}</li>`).join('')}</ol></article>`;
$('#logContent').innerHTML=`<article class="card full"><h2 class="title">Decision log</h2>${DATA.decisionLog.map(x=>`<div class="log"><small>${x.date}</small><b>${x.action}</b><span>${x.assessment}</span></div>`).join('')}</article>`;
}
function move(dir,animate=true){const i=dates.indexOf(selected),n=i+dir;if(n<0||n>=dates.length)return false;const zone=$('#swipeZone');if(animate){zone.style.transition='transform .13s ease,opacity .13s ease';zone.style.transform=`translate3d(${dir>0?-22:22}px,0,0)`;zone.style.opacity='.82';setTimeout(()=>{selected=dates[n];render();zone.style.transition='none';zone.style.transform=`translate3d(${dir>0?18:-18}px,0,0)`;requestAnimationFrame(()=>requestAnimationFrame(()=>{zone.style.transition='transform .2s cubic-bezier(.22,.75,.28,1),opacity .18s ease';zone.style.transform='translate3d(0,0,0)';zone.style.opacity='1'}))},115)}else{selected=dates[n];render()}try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}return true}
async function load(first=false){try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});DATA=await r.json();dates=Object.keys(DATA.days).sort();if(first||!dates.includes(selected))selected=dates[dates.length-1];const t=new Date(DATA.meta.lastUpdated);$('#updated').textContent='עודכן '+t.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' ישראל';render()}catch(e){$('#updated').textContent='שגיאת sync'}}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
$('#older').onclick=$('#edgeOlder').onclick=()=>move(-1);$('#newer').onclick=$('#edgeNewer').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(-1);if(e.key==='ArrowLeft')move(1)});
const zone=$('#swipeZone');let g={id:null,x:0,y:0,t:0,lastX:0,lastY:0,horizontal:false};
zone.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;g={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),lastX:e.clientX,lastY:e.clientY,horizontal:false};try{zone.setPointerCapture(e.pointerId)}catch(_){}zone.style.transition='none'},{passive:true});
zone.addEventListener('pointermove',e=>{if(g.id!==e.pointerId)return;g.lastX=e.clientX;g.lastY=e.clientY;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.horizontal&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.15)g.horizontal=true;if(g.horizontal){const pull=Math.max(-62,Math.min(62,dx*.42));zone.style.transform=`translate3d(${pull}px,0,0)`;zone.style.opacity=String(Math.max(.76,1-Math.abs(pull)/260))}},{passive:true});
function endGesture(e){if(g.id!==e.pointerId)return;const dx=(e.clientX??g.lastX)-g.x,dy=(e.clientY??g.lastY)-g.y,dt=Math.max(1,performance.now()-g.t),vx=Math.abs(dx)/dt;const horizontal=g.horizontal&&Math.abs(dx)>Math.abs(dy)*1.1;zone.style.transition='transform .18s cubic-bezier(.22,.75,.28,1),opacity .16s ease';zone.style.transform='translate3d(0,0,0)';zone.style.opacity='1';if(horizontal&&(Math.abs(dx)>=34||vx>=.32))move(dx>0?-1:1);g.id=null}
zone.addEventListener('pointerup',endGesture,{passive:true});zone.addEventListener('pointercancel',e=>{if(g.id!==e.pointerId)return;zone.style.transition='transform .18s ease,opacity .16s ease';zone.style.transform='translate3d(0,0,0)';zone.style.opacity='1';g.id=null},{passive:true});
load(true);setInterval(()=>load(false),30000);
</script>
