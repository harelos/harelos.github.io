<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#050507">
<title>TigerBrands Control Room</title>
<style>
:root{--bg:#050507;--card:#0d0d13;--card2:#12121b;--line:#282838;--txt:#f7f7fb;--muted:#9292a4;--purple:#8b5cf6;--purple2:#c084fc;--red:#ef4444;--green:#22c55e;--amber:#f59e0b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 82% -5%,rgba(139,92,246,.16),transparent 30%),radial-gradient(circle at 0 18%,rgba(239,68,68,.09),transparent 26%),var(--bg);min-height:100vh;overscroll-behavior-x:none}.wrap{width:min(1220px,calc(100% - 24px));margin:auto;padding:18px 0 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.brand h1{margin:0;font-size:clamp(27px,4vw,43px);letter-spacing:-.045em}.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}.live{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#0a0a0e;border-radius:99px;padding:9px 12px;color:#d4d4de;font-size:11px;white-space:nowrap}.dot{width:8px;height:8px;background:var(--purple);border-radius:50%;box-shadow:0 0 16px var(--purple)}
.daynav{margin:18px 0 7px;display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:9px}.navbtn{height:50px;border:1px solid #343448;background:linear-gradient(180deg,#12121a,#0b0b10);color:#fff;border-radius:15px;font-size:29px;line-height:1;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 8px 25px rgba(0,0,0,.25)}.navbtn:active:not(:disabled){transform:scale(.94);background:rgba(139,92,246,.17);border-color:rgba(139,92,246,.6)}.navbtn:disabled{opacity:.18;cursor:default;box-shadow:none}.datebox{text-align:center;border:1px solid var(--line);background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(239,68,68,.06));border-radius:15px;padding:10px 8px;min-height:50px;display:grid;place-items:center}.datebox strong{display:block;font-size:15px}.datebox small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.swipehint{text-align:center;color:#77778a;font-size:10px;margin:5px 0 9px}.daydots{display:flex;justify-content:center;gap:6px;margin-bottom:12px;direction:ltr}.daydot{width:6px;height:6px;border:0;border-radius:50%;padding:0;background:#383848;transition:.18s ease}.daydot.active{width:18px;border-radius:9px;background:linear-gradient(90deg,var(--purple),var(--purple2))}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#09090d;color:#aaaabb;border-radius:11px;padding:10px 13px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}.tab.active{color:#fff;border-color:rgba(139,92,246,.65);background:rgba(139,92,246,.14)}
.deck{position:relative;min-height:260px;overflow:visible}.swipePreview{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:24px;pointer-events:none;opacity:0;transform:scale(.975);transition:opacity .1s ease,transform .1s ease}.previewPill{max-width:86%;padding:10px 15px;border:1px solid rgba(139,92,246,.42);background:rgba(15,12,25,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;color:#ddd6fe;font-size:12px;font-weight:800;box-shadow:0 18px 55px rgba(0,0,0,.38)}.previewPill small{display:block;font-size:9px;font-weight:600;color:#8f8fa3;margin-top:2px}.swipeSurface{position:relative;z-index:2;touch-action:pan-y pinch-zoom;will-change:transform;transform:translate3d(0,0,0) rotate(0deg);transform-origin:50% 14%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.swipeSurface.dragging{filter:drop-shadow(0 24px 36px rgba(0,0,0,.28))}.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px}.card{background:linear-gradient(180deg,rgba(17,17,25,.97),rgba(9,9,13,.97));border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 15px 45px rgba(0,0,0,.18)}.full{grid-column:1/-1}.wide{grid-column:span 6}.metric{grid-column:span 3;min-height:177px;display:flex;flex-direction:column}.label{color:var(--muted);font-size:11px}.value{font-size:clamp(27px,3.2vw,39px);font-weight:850;letter-spacing:-.04em;margin-top:8px}.sub{color:var(--muted);font-size:10px;margin-top:4px;line-height:1.4}.status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:850;white-space:nowrap}.status.strong{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.26);color:#86efac}.status.watch{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.25);color:#fcd34d}.status.weak{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.26);color:#fda4af}.status.sample{background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.25);color:#c4b5fd}
.goalbox{margin-top:auto;padding-top:9px;border-top:1px solid #20202b}.goalrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;line-height:1.45}.goalrow+.goalrow{margin-top:3px}.goalrow span{color:#747487}.goalrow b{font-size:9px;color:#d5d5de;font-weight:750}.goalbar{height:4px;background:#1d1d28;border-radius:99px;overflow:hidden;margin-top:7px;position:relative}.goalbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--purple2))}.range{margin-top:5px;color:#6f6f80;font-size:8px;line-height:1.35}.why{margin-top:4px}.why summary{cursor:pointer;color:#8f7cf7;font-size:8px;list-style:none}.why summary::-webkit-details-marker{display:none}.why p{margin:5px 0 0;padding:6px 7px;border-radius:8px;background:#0a0a0f;color:#9292a4;font-size:8px;line-height:1.5}
.context{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:11px}.contextItem{background:#09090d;border:1px solid #20202a;border-radius:13px;padding:10px}.contextItem small{display:block;color:#737383;font-size:8px}.contextItem b{display:block;margin-top:4px;font-size:15px}.contextItem em{font-style:normal;display:block;color:#77778a;font-size:8px;margin-top:4px}.title{font-size:15px;margin:0 0 13px}.heroAdvice{position:relative;overflow:hidden}.heroAdvice:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;left:-65px;top:-75px;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 67%)}.verdict{display:inline-flex;padding:6px 9px;border-radius:99px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.25);color:#fda4af;font-size:10px;font-weight:900}.heroAdvice h2{font-size:22px;margin:13px 0 8px;letter-spacing:-.02em}.heroAdvice p{color:#b9b9c5;line-height:1.7;font-size:13px;margin:0;max-width:850px}
.targetGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.targetCard{background:#09090d;border:1px solid #20202a;border-radius:14px;padding:12px}.targetTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.targetTop b{font-size:12px}.targetNow{font-size:21px;font-weight:850}.targetLines{margin-top:9px;display:grid;gap:4px;font-size:9px}.targetLines div{display:flex;justify-content:space-between;gap:10px}.targetLines span{color:#77778a}.targetLines strong{color:#d0d0da}.basis{margin-top:8px;color:#8d8d9d;font-size:9px;line-height:1.55;padding-top:7px;border-top:1px solid #20202b}
.campaign{padding:14px 0;border-bottom:1px solid #20202b}.campaign:last-child{border-bottom:0}.campaigntop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cname{font-size:14px;font-weight:800}.cfull{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.badge{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:850;white-space:nowrap}.badge.active{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);color:#c4b5fd}.badge.paused{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fecaca}.badge.history{background:#111118;border:1px solid #292936;color:#aaaaba}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.stat{background:#09090d;border:1px solid #20202a;border-radius:11px;padding:9px}.stat small{display:block;color:var(--muted);font-size:8px}.stat b{display:block;margin-top:4px;font-size:13px}.microgoal{display:block;margin-top:4px;color:#767689;font-size:8px;line-height:1.3}.advisorline{margin-top:10px;border-right:3px solid var(--purple);background:rgba(139,92,246,.06);padding:10px 11px;border-radius:9px;color:#c9c9d2;font-size:11px;line-height:1.6}.rules{margin:0;padding:0;counter-reset:r}.rules li{list-style:none;counter-increment:r;position:relative;padding:13px 46px 13px 12px;border-bottom:1px solid #20202b;color:#c5c5cf;font-size:12px;line-height:1.6}.rules li:last-child{border-bottom:0}.rules li:before{content:counter(r);position:absolute;right:8px;top:11px;width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:#c4b5fd;font-weight:900}.warning{border-color:rgba(239,68,68,.28);background:linear-gradient(180deg,rgba(45,10,17,.32),rgba(12,9,13,.95))}.log{display:grid;grid-template-columns:110px 1fr 2fr;gap:10px;padding:12px 0;border-bottom:1px solid #20202b}.log:last-child{border-bottom:0}.log small{color:var(--muted)}.log b{font-size:12px}.log span{font-size:11px;color:#b4b4bf;line-height:1.5}.footer{text-align:center;color:#5f5f70;font-size:10px;margin-top:24px}
.edgeNav{position:fixed;z-index:60;top:54%;transform:translateY(-50%);width:40px;height:72px;border:1px solid rgba(139,92,246,.28);background:rgba(10,10,15,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:28px;display:none;place-items:center;box-shadow:0 12px 35px rgba(0,0,0,.32);-webkit-tap-highlight-color:transparent;touch-action:manipulation}.edgeNav.left{left:0;border-radius:0 18px 18px 0;border-left:0}.edgeNav.right{right:0;border-radius:18px 0 0 18px;border-right:0}.edgeNav:active:not(:disabled){background:rgba(139,92,246,.24)}.edgeNav:disabled{opacity:.12;pointer-events:none}
@media(max-width:900px){.metric{grid-column:span 6}.wide{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}.top{flex-direction:column}.live{align-self:flex-start}.log{grid-template-columns:1fr}.edgeNav{display:grid}}
@media(max-width:620px){.wrap{width:calc(100% - 18px);padding-top:12px}.metric{grid-column:span 6;min-height:180px;padding:11px}.value{font-size:28px}.card{border-radius:14px}.stats{grid-template-columns:1fr 1fr}.brand h1{font-size:30px}.daynav{grid-template-columns:52px 1fr 52px}.navbtn{height:50px}.edgeNav{width:32px;height:66px;font-size:24px;opacity:.9}.swipePreview{padding-top:14px}.context{grid-template-columns:1fr 1fr}.targetGrid{grid-template-columns:1fr}.goalrow{font-size:8px}.goalrow b{font-size:8px}}
</style>
</head>
<body>
<button class="edgeNav left" id="edgeNewer" aria-label="יום חדש יותר">‹</button>
<button class="edgeNav right" id="edgeOlder" aria-label="יום ישן יותר">›</button>
<main class="wrap" id="app">
<header class="top"><div class="brand"><h1>Control Room</h1><p>TigerBrands · Meta + Shopify · target-first</p></div><div class="live"><span class="dot"></span><span id="updated">טוען…</span></div></header>
<div class="daynav"><button class="navbtn" id="newer" aria-label="יום חדש יותר">‹</button><div class="datebox"><div><strong id="dateLabel">—</strong><small id="dateMeta">—</small></div></div><button class="navbtn" id="older" aria-label="יום ישן יותר">›</button></div>
<div class="swipehint">תפוס את אזור הנתונים וגרור · אתה רואה את הכרטיס זז לפני ההחלטה</div>
<div class="daydots" id="dayDots" aria-hidden="true"></div>
<nav class="tabs"><button class="tab active" data-tab="overview">מצב</button><button class="tab" data-tab="campaigns">קמפיינים</button><button class="tab" data-tab="targets">יעדים</button><button class="tab" data-tab="advisor">Advisor</button><button class="tab" data-tab="guard">Decision Guard</button><button class="tab" data-tab="log">יומן</button></nav>
<div class="deck"><div class="swipePreview" id="swipePreview"><div class="previewPill" id="previewPill">—</div></div><div class="swipeSurface" id="swipeSurface">
<section id="overview" class="section active"><div id="overviewContent"></div></section>
<section id="campaigns" class="section"><div id="campaignContent"></div></section>
<section id="targets" class="section"><div id="targetContent"></div></section>
<section id="advisor" class="section"><div id="advisorContent" class="grid"></div></section>
<section id="guard" class="section"><div id="guardContent" class="grid"></div></section>
<section id="log" class="section"><div id="logContent" class="grid"></div></section>
</div></div>
<div class="footer">GitHub Pages · manual sync until direct API integration</div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let DATA=null,dates=[],selected=null,animating=false;
const money=n=>n==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n),num=n=>n==null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n),pct=n=>n==null?'—':`${num(n)}%`,ratio=(a,b)=>b?100*a/b:0;
function formatGoal(g,v){if(v==null)return'—';if(g.format==='money')return money(v);if(g.format==='percent')return pct(v);return num(v)}
function symbol(g){return g.direction==='higher'?'≥':'≤'}
function rangeText(g){return g.direction==='higher'?`טוב ${symbol(g)}${formatGoal(g,g.target)} · בינוני ${formatGoal(g,g.watch)}–${formatGoal(g,g.target)} · חלש <${formatGoal(g,g.watch)}`:`טוב ${symbol(g)}${formatGoal(g,g.target)} · בינוני ${formatGoal(g,g.target)}–${formatGoal(g,g.watch)} · חלש >${formatGoal(g,g.watch)}`}
function grade(key,v,sample=true){const g=DATA.metricGoals[key];if(!sample||v==null)return{c:'sample',txt:'מעט דאטה'};const good=g.direction==='higher'?v>=g.target:v<=g.target,watch=g.direction==='higher'?v>=g.watch:v<=g.watch;if(good)return{c:'strong',txt:'עומד ביעד'};if(watch)return{c:'watch',txt:'ביניים'};return{c:'weak',txt:'מחוץ ליעד'}}
function metricValue(d,key){const m=d.metaAds,s=d.shopify;const map={roas:m.roas,shopifyCvr:s.conversionRate,ctr:m.ctr,cpc:m.cpc,cpm:m.cpm,costPerLpv:m.costPerLandingPageView,lpvToAtc:ratio(m.addToCarts,m.landingPageViews),costPerAtc:m.costPerAddToCart,atcToCheckout:ratio(m.initiateCheckouts,m.addToCarts),costPerCheckout:m.costPerCheckout,checkoutToPurchase:ratio(m.purchases,m.initiateCheckouts),lpvToPurchase:ratio(m.purchases,m.landingPageViews),cpa:m.costPerPurchase};return map[key]}
function historical(key){const i=dates.indexOf(selected),prev=dates.slice(Math.max(0,i-7),i);const vals=prev.map(x=>metricValue(DATA.days[x],key)).filter(v=>Number.isFinite(v));if(!vals.length)return null;return{avg:vals.reduce((a,b)=>a+b,0)/vals.length,n:vals.length}}
function progress(g,v){if(v==null)return 0;if(g.direction==='higher')return Math.max(4,Math.min(100,100*v/g.target));return Math.max(4,Math.min(100,100*g.target/Math.max(.0001,v)))}
function statusPill(h){return`<span class="status ${h.c}">${h.txt}</span>`}
function goalBox(key,v,sample=true){const g=DATA.metricGoals[key],h=historical(key),gr=grade(key,v,sample);return`<div class="goalbox"><div class="goalrow"><span>יעד</span><b>${symbol(g)} ${formatGoal(g,g.target)}</b></div><div class="goalrow"><span>היסטוריה${h?` · ${h.n} ימים`:''}</span><b>${h?formatGoal(g,h.avg):'אין עדיין'}</b></div><div class="goalrow"><span>סטטוס</span>${statusPill(gr)}</div><div class="goalbar"><i style="width:${progress(g,v)}%"></i></div><div class="range">${rangeText(g)}</div><details class="why"><summary>למה זה היעד?</summary><p>${g.basis}</p></details></div>`}
function metricCard(key,label,v,sub='',sample=true){const g=DATA.metricGoals[key];return`<article class="card metric"><div class="label">${label}</div><div class="value">${formatGoal(g,v)}</div>${sub?`<div class="sub">${sub}</div>`:''}${goalBox(key,v,sample)}</article>`}
function clsStatus(s){if(s==='ACTIVE')return'active';if(s==='PAUSED')return'paused';return'history'}function statusLabel(s){return s==='ACTIVE'?'ACTIVE':s==='PAUSED'?'PAUSED':s==='STARTED_LATE'?'STARTED LATE':'HISTORICAL'}
function renderDots(){const i=dates.indexOf(selected);$('#dayDots').innerHTML=dates.map((d,j)=>`<span class="daydot ${j===i?'active':''}"></span>`).join('')}
function render(){if(!DATA||!selected)return;const d=DATA.days[selected],m=d.metaAds,s=d.shopify,i=dates.indexOf(selected);$('#older').disabled=$('#edgeOlder').disabled=i===0;$('#newer').disabled=$('#edgeNewer').disabled=i===dates.length-1;const dt=new Date(selected+'T12:00:00');$('#dateLabel').textContent=dt.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});$('#dateMeta').textContent=selected===dates.at(-1)?'היום / snapshot אחרון':'snapshot היסטורי';renderDots();
const lpvAtc=ratio(m.addToCarts,m.landingPageViews),atcChk=ratio(m.initiateCheckouts,m.addToCarts),chkPur=ratio(m.purchases,m.initiateCheckouts),lpvPur=ratio(m.purchases,m.landingPageViews),purchaseTarget=Math.max(1,Math.ceil(m.spend/DATA.metricGoals.cpa.target)),revenueTarget=m.spend*DATA.metricGoals.roas.target;
$('#overviewContent').innerHTML=`<div class="context"><div class="contextItem"><small>Spend · context</small><b>${money(m.spend)}</b><em>לא KPI איכות בפני עצמו</em></div><div class="contextItem"><small>Purchases</small><b>${num(m.purchases)}</b><em>יעד בקצב הנוכחי ≈ ${purchaseTarget}</em></div><div class="contextItem"><small>Purchase value</small><b>${money(m.purchaseValue)}</b><em>יעד לפי ROAS 3 ≈ ${money(revenueTarget)}</em></div><div class="contextItem"><small>Paid LPV</small><b>${num(m.landingPageViews)}</b><em>האיכות נמדדת דרך Cost/LPV והמשך הפאנל</em></div></div><div class="grid">${metricCard('roas','ROAS',m.roas,'יעד תפעולי; break-even אמיתי עדיין חסר')}${metricCard('shopifyCvr','Shopify CVR',s.conversionRate,'Storewide conversion')}${metricCard('ctr','CTR',m.ctr,'Click-through rate')}${metricCard('cpc','CPC',m.cpc,'עלות לקליק')}${metricCard('costPerLpv','Cost / LPV',m.costPerLandingPageView,'עלות להגעה אמיתית לדף')}${metricCard('lpvToAtc','LPV → ATC',lpvAtc,'כמה מהנכנסים מוסיפים לסל',m.landingPageViews>=8)}${metricCard('atcToCheckout','ATC → Checkout',atcChk,'כמה מהסלים מתקדמים לתשלום',m.addToCarts>=5)}${metricCard('checkoutToPurchase','Checkout → Purchase',chkPur,'כמה מה-checkouts נסגרים',m.initiateCheckouts>=3)}${metricCard('costPerAtc','Cost / ATC',m.costPerAddToCart,'עלות לכוונת קנייה',m.addToCarts>0)}${metricCard('costPerCheckout','Cost / Checkout',m.costPerCheckout,'עלות להגעה ל-checkout',m.initiateCheckouts>0)}${metricCard('lpvToPurchase','LPV → Purchase',lpvPur,'Paid landing traffic → purchase',m.landingPageViews>=15)}${metricCard('cpa','CPA',m.costPerPurchase,'יעד זמני עד break-even CPA',m.purchases>0)}</div>`;
$('#campaignContent').innerHTML=`<article class="card full"><h2 class="title">Campaign performance — ${selected}</h2>${d.campaigns.map(c=>{const a=ratio(c.addToCarts,c.landingPageViews),q=ratio(c.checkouts,c.addToCarts),p=ratio(c.purchases,c.checkouts);return`<div class="campaign"><div class="campaigntop"><div><div class="cname">${c.shortName}</div><div class="cfull">${c.name}</div></div><span class="badge ${clsStatus(c.status)}">${statusLabel(c.status)}</span></div><div class="stats"><div class="stat"><small>Spend</small><b>${money(c.spend)}</b></div><div class="stat"><small>ROAS</small><b>${num(c.roas)}</b><span class="microgoal">יעד ≥3 · ${grade('roas',c.roas,c.purchases>0).txt}</span></div><div class="stat"><small>LPV→ATC</small><b>${pct(a)}</b><span class="microgoal">יעד ≥20% · ${grade('lpvToAtc',a,c.landingPageViews>=8).txt}</span></div><div class="stat"><small>ATC→Checkout</small><b>${pct(q)}</b><span class="microgoal">יעד ≥40% · ${grade('atcToCheckout',q,c.addToCarts>=5).txt}</span></div><div class="stat"><small>Checkout→Purchase</small><b>${pct(p)}</b><span class="microgoal">יעד ≥30% · ${grade('checkoutToPurchase',p,c.checkouts>=3).txt}</span></div><div class="stat"><small>CPA</small><b>${money(c.costPerPurchase)}</b><span class="microgoal">יעד זמני ≤$22.50</span></div></div><div class="advisorline">${c.advisor}</div></div>`}).join('')}</article>`;
const keys=['roas','shopifyCvr','ctr','cpc','cpm','costPerLpv','lpvToAtc','costPerAtc','atcToCheckout','costPerCheckout','checkoutToPurchase','lpvToPurchase','cpa'];$('#targetContent').innerHTML=`<article class="card full"><h2 class="title">יעדים — לא ״טוב/רע״ בלי מספר</h2><div class="targetGrid">${keys.map(k=>{const g=DATA.metricGoals[k],v=metricValue(d,k),h=historical(k),gr=grade(k,v,true);return`<div class="targetCard"><div class="targetTop"><div><b>${g.label}</b><div style="margin-top:6px">${statusPill(gr)}</div></div><div class="targetNow">${formatGoal(g,v)}</div></div><div class="targetLines"><div><span>יעד</span><strong>${symbol(g)} ${formatGoal(g,g.target)}</strong></div><div><span>ביניים עד</span><strong>${formatGoal(g,g.watch)}</strong></div><div><span>ממוצע היסטורי</span><strong>${h?formatGoal(g,h.avg):'—'}</strong></div><div><span>טווחים</span><strong>${rangeText(g)}</strong></div></div><div class="basis">${g.basis}</div></div>`}).join('')}</div></article>`;
$('#advisorContent').innerHTML=`<article class="card full heroAdvice"><span class="verdict">${d.advisor.verdict}</span><h2>${d.advisor.headline}</h2><p>${d.advisor.body}</p></article><article class="card full"><h2 class="title">איך מתקבלת החלטה עכשיו</h2><div class="advisorline">הצבע לבדו לא קובע. כל החלטה נשענת על: יעד מספרי → פער מהיעד → היסטוריה קודמת → sample size → rolling view → cash risk. אם המדד ״חלש״ אבל המדגם קטן, הוא לא מקבל כוח להפעיל שינוי מבני.</div></article>`;
$('#guardContent').innerHTML=`<article class="card wide"><h2 class="title">${DATA.decisionPolicy.headline}</h2><ol class="rules">${DATA.decisionPolicy.rules.map(r=>`<li>${r}</li>`).join('')}</ol></article><article class="card wide warning"><h2 class="title">Stop-loss logic</h2><ol class="rules">${DATA.decisionPolicy.stopLossLogic.map(r=>`<li>${r}</li>`).join('')}</ol></article>`;
$('#logContent').innerHTML=`<article class="card full"><h2 class="title">Decision log</h2>${DATA.decisionLog.map(x=>`<div class="log"><small>${x.date}</small><b>${x.action}</b><span>${x.assessment}</span></div>`).join('')}</article>`}
function move(dir){if(animating)return;const i=dates.indexOf(selected),n=i+dir;if(n<0||n>=dates.length)return;selected=dates[n];render()}
function targetFor(dx){const i=dates.indexOf(selected),dir=dx>0?-1:1,n=i+dir;return n>=0&&n<dates.length?{dir,n}:null}
const surface=$('#swipeSurface'),preview=$('#swipePreview'),previewPill=$('#previewPill');function previewFor(dx){const t=targetFor(dx);if(!t){preview.style.opacity='0';return}const d=dates[t.n],dt=new Date(d+'T12:00:00');previewPill.innerHTML=`${dt.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit'})}<small>${dx>0?'יום קודם':'יום חדש יותר'} · שחרור מספיק רחוק יעביר</small>`;preview.style.opacity=String(Math.min(.96,.18+Math.abs(dx)/170));preview.style.transform=`scale(${.975+Math.min(.02,Math.abs(dx)/6000)})`}
function resetCard(){surface.style.transition='transform .22s cubic-bezier(.22,.75,.28,1)';surface.style.transform='translate3d(0,0,0) rotate(0deg)';surface.classList.remove('dragging');preview.style.opacity='0'}
function commitSwipe(dx){const t=targetFor(dx);if(!t){resetCard();return}animating=true;surface.style.transition='transform .18s cubic-bezier(.3,.8,.3,1),opacity .18s';surface.style.transform=`translate3d(${dx>0?window.innerWidth*1.08:-window.innerWidth*1.08}px,0,0) rotate(${dx>0?5:-5}deg)`;surface.style.opacity='.3';setTimeout(()=>{selected=dates[t.n];render();surface.style.transition='none';surface.style.transform=`translate3d(${dx>0?-70:70}px,0,0) rotate(0deg)`;surface.style.opacity='.55';requestAnimationFrame(()=>requestAnimationFrame(()=>{surface.style.transition='transform .22s cubic-bezier(.22,.75,.28,1),opacity .18s';surface.style.transform='translate3d(0,0,0) rotate(0deg)';surface.style.opacity='1';preview.style.opacity='0';surface.classList.remove('dragging');animating=false}))},170)}
let touch=null;surface.addEventListener('touchstart',e=>{if(animating||e.touches.length!==1)return;const t=e.touches[0];touch={x:t.clientX,y:t.clientY,lastX:t.clientX,lastY:t.clientY,time:performance.now(),mode:null};surface.style.transition='none'},{passive:true});surface.addEventListener('touchmove',e=>{if(!touch||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch.lastX=t.clientX;touch.lastY=t.clientY;if(!touch.mode&&Math.hypot(dx,dy)>6){if(Math.abs(dx)>Math.abs(dy)*1.04)touch.mode='x';else if(Math.abs(dy)>Math.abs(dx)*1.18)touch.mode='y'}if(touch.mode==='x'){e.preventDefault();const bounded=Math.max(-window.innerWidth*.82,Math.min(window.innerWidth*.82,dx));surface.classList.add('dragging');surface.style.transform=`translate3d(${bounded}px,0,0) rotate(${Math.max(-4,Math.min(4,bounded/65))}deg)`;previewFor(dx)}},{passive:false});function endTouch(){if(!touch)return;const dx=touch.lastX-touch.x,dt=Math.max(1,performance.now()-touch.time),v=Math.abs(dx)/dt,wasX=touch.mode==='x';touch=null;if(wasX&&(Math.abs(dx)>Math.min(92,window.innerWidth*.24)||v>.52)&&targetFor(dx))commitSwipe(dx);else resetCard()}surface.addEventListener('touchend',endTouch,{passive:true});surface.addEventListener('touchcancel',()=>{touch=null;resetCard()},{passive:true});
let mouse=null;surface.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||animating)return;mouse={x:e.clientX,time:performance.now()};surface.setPointerCapture?.(e.pointerId);surface.style.transition='none'});surface.addEventListener('pointermove',e=>{if(!mouse)return;const dx=e.clientX-mouse.x;surface.classList.add('dragging');surface.style.transform=`translate3d(${dx}px,0,0) rotate(${Math.max(-4,Math.min(4,dx/65))}deg)`;previewFor(dx)});surface.addEventListener('pointerup',e=>{if(!mouse)return;const dx=e.clientX-mouse.x,dt=Math.max(1,performance.now()-mouse.time),v=Math.abs(dx)/dt;mouse=null;if((Math.abs(dx)>90||v>.52)&&targetFor(dx))commitSwipe(dx);else resetCard()});
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');resetCard()});$('#older').onclick=$('#edgeOlder').onclick=()=>move(-1);$('#newer').onclick=$('#edgeNewer').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(-1);if(e.key==='ArrowLeft')move(1)});
async function load(first=false){try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});DATA=await r.json();dates=Object.keys(DATA.days).sort();if(first||!dates.includes(selected))selected=dates.at(-1);const t=new Date(DATA.meta.lastUpdated);$('#updated').textContent='עודכן '+t.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' ישראל';render()}catch(e){$('#updated').textContent='שגיאת sync'}}load(true);setInterval(()=>load(false),30000);
</script>
</body>
