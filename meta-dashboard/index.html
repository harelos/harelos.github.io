<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 85% -10%,rgba(139,92,246,.18),transparent 32%),radial-gradient(circle at 0 25%,rgba(239,68,68,.08),transparent 28%),var(--bg);min-height:100vh;overscroll-behavior-x:none}.wrap{width:min(1180px,calc(100% - 18px));margin:auto;padding:14px 0 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand h1{margin:0;font-size:clamp(27px,4vw,42px);letter-spacing:-.045em}.brand p{margin:6px 0 0;color:var(--muted);font-size:11px}.topActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill,.btn{border:1px solid var(--line);background:#0b0b11;color:#d8d8e1;border-radius:12px;padding:9px 11px;font-size:10px}.pill{display:flex;gap:6px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--purple);box-shadow:0 0 12px var(--purple)}.btn{cursor:pointer;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.97)}.btn.primary{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.42);color:#ddd6fe}.btn.danger{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.30);color:#fecaca}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.daynav{margin:15px 0 6px;display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}.navbtn{height:48px;border:1px solid #353549;background:linear-gradient(180deg,#13131c,#0b0b10);color:#fff;border-radius:14px;font-size:28px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.navbtn:disabled{opacity:.16}.datebox{text-align:center;border:1px solid var(--line);background:linear-gradient(135deg,rgba(139,92,246,.13),rgba(239,68,68,.05));border-radius:14px;min-height:48px;padding:8px;display:grid;place-items:center}.datebox strong{font-size:14px}.datebox small{font-size:9px;color:var(--muted);display:block;margin-top:2px}.swipehint{text-align:center;color:#6f6f82;font-size:9px;margin:5px 0 8px}.daydots{display:flex;justify-content:center;gap:5px;direction:ltr;margin-bottom:10px}.daydot{height:5px;width:5px;border-radius:99px;background:#373748}.daydot.active{width:18px;background:linear-gradient(90deg,var(--purple),var(--purple2))}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#09090e;color:#aaaabb;border-radius:11px;padding:9px 12px;white-space:nowrap;cursor:pointer}.tab.active{color:#fff;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.12)}
.deck{position:relative;min-height:260px}.swipePreview{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;pointer-events:none;opacity:0;transform:scale(.98);transition:.12s}.previewPill{padding:9px 13px;border:1px solid rgba(139,92,246,.38);background:rgba(14,12,24,.96);border-radius:999px;color:#ddd6fe;font-size:11px;font-weight:800;box-shadow:0 18px 50px rgba(0,0,0,.35)}.previewPill small{display:block;color:#858598;font-size:8px;font-weight:600;margin-top:2px}.swipeSurface{position:relative;z-index:2;will-change:transform;transform:translate3d(0,0,0) rotate(0deg);transform-origin:50% 12%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y pinch-zoom}.swipeSurface.dragging{filter:drop-shadow(0 22px 34px rgba(0,0,0,.28))}.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}.card{background:linear-gradient(180deg,rgba(17,17,25,.98),rgba(9,9,13,.98));border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 14px 42px rgba(0,0,0,.16)}.full{grid-column:1/-1}.wide{grid-column:span 6}.metric{grid-column:span 3;min-height:158px;display:flex;flex-direction:column}.label{font-size:10px;color:var(--muted)}.value{font-size:clamp(25px,3vw,36px);font-weight:880;letter-spacing:-.045em;margin-top:7px}.sub{color:#737386;font-size:8px;margin-top:3px}.goalbox{margin-top:auto;padding-top:7px;border-top:1px solid #20202b}.goalrow{display:flex;justify-content:space-between;gap:7px;font-size:8px}.goalrow span{color:#737386}.goalrow b{font-size:8px;color:#d4d4de}.state{display:inline-flex;border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}.state.good{color:#86efac;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.25)}.state.watch{color:#fcd34d;background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.24)}.state.bad{color:#fda4af;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25)}.state.sample{color:#c4b5fd;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.25)}.goalbar{height:4px;border-radius:99px;background:#1d1d27;margin-top:6px;overflow:hidden}.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:99px}.why{margin-top:4px}.why summary{font-size:8px;color:#8f7cf7;cursor:pointer;list-style:none}.why summary::-webkit-details-marker{display:none}.why p{font-size:8px;color:#89899a;line-height:1.45;margin:5px 0 0;background:#09090d;padding:6px;border-radius:7px}.title{font-size:14px;margin:0 0 10px}.contextGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.mini{background:#09090d;border:1px solid #20202a;border-radius:11px;padding:9px}.mini small{display:block;color:#747487;font-size:8px}.mini b{display:block;margin-top:3px;font-size:14px}.mini em{display:block;font-style:normal;color:#737386;font-size:8px;margin-top:3px}.advisorBox{border-color:rgba(139,92,246,.28);background:linear-gradient(180deg,rgba(30,19,52,.34),rgba(9,9,13,.98))}.verdict{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);color:#ddd6fe}.advisorBox h2{font-size:19px;margin:10px 0 6px}.advisorBox p{font-size:11px;line-height:1.65;color:#b7b7c2;margin:0}.targetGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.targetCard{background:#09090d;border:1px solid #20202a;border-radius:12px;padding:11px}.targetTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.targetTop b{font-size:11px}.targetNow{font-size:20px;font-weight:850}.targetLines{display:grid;gap:3px;margin-top:7px}.targetLines div{display:flex;justify-content:space-between;gap:8px;font-size:8px}.targetLines span{color:#757588}.targetLines strong{color:#d0d0da}.basis{border-top:1px solid #20202b;margin-top:7px;padding-top:6px;color:#89899a;font-size:8px;line-height:1.5}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stage{background:#09090d;border:1px solid #20202a;border-radius:11px;padding:9px}.stage small{color:#747487;font-size:8px}.stage b{font-size:18px;display:block;margin-top:3px}.stage em{font-style:normal;color:#aaaabb;font-size:9px;display:block;margin-top:5px}.campaign{padding:12px 0;border-bottom:1px solid #20202b}.campaign:last-child{border-bottom:0}.campaignTop{display:flex;justify-content:space-between;gap:8px}.cname{font-size:12px;font-weight:850}.cfull{font-size:8px;color:#77778b;margin-top:3px;line-height:1.4}.badge{border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}.badge.active{color:#c4b5fd;background:rgba(139,92,246,.11);border:1px solid rgba(139,92,246,.25)}.badge.paused{color:#fecaca;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:9px}.stat{background:#09090d;border:1px solid #20202a;border-radius:9px;padding:7px}.stat small{font-size:7px;color:#737386}.stat b{font-size:11px;display:block;margin-top:3px}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.budgetInput,.field,.select{background:#08080d;color:#fff;border:1px solid #303041;border-radius:9px;padding:8px 9px;font-size:10px;min-width:0}.budgetInput{width:86px}.advisorline{margin-top:8px;padding:8px 9px;border-right:3px solid var(--purple);background:rgba(139,92,246,.06);border-radius:8px;color:#bdbdc7;font-size:9px;line-height:1.5}
.formGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fieldWrap label{display:block;font-size:8px;color:#858598;margin-bottom:4px}.field,.select{width:100%}.bigAction{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.memoryStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.memoryItem{background:#09090d;border:1px solid #20202a;border-radius:10px;padding:9px}.memoryItem small{font-size:7px;color:#747487}.memoryItem b{display:block;font-size:10px;margin-top:3px}.codeish{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#07070b;border:1px solid #20202a;border-radius:10px;padding:9px;color:#aaaabb;font-size:8px;line-height:1.5;max-height:230px;overflow:auto}.rules{margin:0;padding:0;counter-reset:r}.rules li{list-style:none;counter-increment:r;position:relative;padding:10px 38px 10px 8px;border-bottom:1px solid #20202b;color:#c5c5cf;font-size:10px;line-height:1.5}.rules li:before{content:counter(r);position:absolute;right:6px;top:8px;width:23px;height:23px;display:grid;place-items:center;border-radius:7px;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.22);color:#c4b5fd;font-size:9px;font-weight:900}.log{display:grid;grid-template-columns:95px 1fr 2fr;gap:8px;padding:10px 0;border-bottom:1px solid #20202b}.log small{color:#77778b;font-size:8px}.log b{font-size:10px}.log span{font-size:9px;color:#aaaabb;line-height:1.45}.statusline{font-size:9px;color:#9696a8;margin-top:8px}.footer{text-align:center;color:#555568;font-size:8px;margin-top:22px}
.edgeNav{position:fixed;z-index:80;top:54%;transform:translateY(-50%);width:32px;height:64px;border:1px solid rgba(139,92,246,.25);background:rgba(10,10,15,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:23px;display:none;place-items:center}.edgeNav.left{left:0;border-radius:0 16px 16px 0;border-left:0}.edgeNav.right{right:0;border-radius:16px 0 0 16px;border-right:0}.edgeNav:disabled{opacity:.12;pointer-events:none}
.toast{position:fixed;z-index:120;right:12px;left:12px;bottom:14px;max-width:520px;margin:auto;background:#12121a;border:1px solid #343447;border-radius:12px;padding:10px 12px;font-size:10px;color:#d9d9e2;box-shadow:0 20px 70px rgba(0,0,0,.5);opacity:0;transform:translateY(20px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}
@media(max-width:900px){.metric{grid-column:span 6}.wide{grid-column:1/-1}.top{flex-direction:column}.edgeNav{display:grid}.stats{grid-template-columns:repeat(3,1fr)}.formGrid{grid-template-columns:1fr 1fr}.memoryStrip{grid-template-columns:1fr 1fr}.log{grid-template-columns:1fr}}
@media(max-width:560px){.metric{grid-column:span 6;min-height:160px;padding:10px}.value{font-size:27px}.contextGrid{grid-template-columns:1fr 1fr}.targetGrid{grid-template-columns:1fr}.funnel{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.formGrid{grid-template-columns:1fr 1fr}.brand h1{font-size:29px}.topActions{width:100%}.pill,.topActions .btn{flex:1;justify-content:center;text-align:center}.wide{grid-column:1/-1}}
</style>
</head>
<body>
<button class="edgeNav left" id="edgeNewer">‹</button><button class="edgeNav right" id="edgeOlder">›</button>
<main class="wrap">
<header class="top"><div class="brand"><h1>Control Room</h1><p>TigerBrands · Meta + Shopify · target-first · AI-ready</p></div><div class="topActions"><div class="pill"><span class="dot"></span><span id="updated">טוען…</span></div><div class="pill" id="backendPill">Backend: read-only</div><button class="btn primary" id="refreshBtn">↻ רפרש</button></div></header>
<div class="daynav"><button class="navbtn" id="newer">‹</button><div class="datebox"><div><strong id="dateLabel">—</strong><small id="dateMeta">—</small></div></div><button class="navbtn" id="older">›</button></div>
<div class="swipehint">תפוס את הנתונים וגרור כמו כרטיס · שחרור קצר מחזיר למקום</div><div class="daydots" id="dayDots"></div>
<nav class="tabs"><button class="tab active" data-tab="today">היום</button><button class="tab" data-tab="campaigns">קמפיינים</button><button class="tab" data-tab="targets">יעדים</button><button class="tab" data-tab="ai">AI Advisor</button><button class="tab" data-tab="guard">Guard</button><button class="tab" data-tab="ledger">לוג</button></nav>
<div class="deck"><div class="swipePreview" id="swipePreview"><div class="previewPill" id="previewPill">—</div></div><div class="swipeSurface" id="swipeSurface">
<section class="section active" id="today"><div class="grid" id="todayContent"></div></section>
<section class="section" id="campaigns"><div id="campaignContent"></div></section>
<section class="section" id="targets"><div id="targetContent"></div></section>
<section class="section" id="ai"><div id="aiContent"></div></section>
<section class="section" id="guard"><div id="guardContent"></div></section>
<section class="section" id="ledger"><div id="ledgerContent"></div></section>
</div></div><div class="footer">GitHub Pages frontend · privileged APIs intentionally not embedded</div>
</main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let DATA=null,MEMORY=null,LEDGER=[],dates=[],selected=null,backend=false,animating=false;
const money=n=>n==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n),num=n=>n==null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n),pct=n=>n==null?'—':`${num(n)}%`,ratio=(a,b)=>b?100*a/b:0;
const fmt=(v,g)=>g?.format==='money'?money(v):g?.format==='percent'?pct(v):num(v);function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2500)}
function avgMetric(key,src='metaAds'){const xs=dates.map(d=>DATA.days[d]?.[src]?.[key]).filter(v=>Number.isFinite(v));return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}function goalState(v,g,sample=true){if(v==null||!g)return{c:'sample',t:'אין יעד'};if(sample===false)return{c:'sample',t:'מעט דאטה'};const good=g.direction==='lower'?v<=g.target:v>=g.target,watch=g.direction==='lower'?v<=g.watch:v>=g.watch;return good?{c:'good',t:'במטרה'}:watch?{c:'watch',t:'ביניים'}:{c:'bad',t:'מחוץ ליעד'}}
function goalHtml(key,v,avg){const g=DATA.metricGoals?.[key];if(!g)return'';const st=goalState(v,g);const progress=g.direction==='lower'?Math.min(100,(g.target/Math.max(.0001,v))*100):Math.min(100,(v/g.target)*100);const range=g.direction==='lower'?`יעד ≤ ${fmt(g.target,g)} · אזהרה > ${fmt(g.watch,g)}`:`יעד ≥ ${fmt(g.target,g)} · אזהרה < ${fmt(g.watch,g)}`;return `<div class="goalbox"><div class="goalrow"><span>יעד</span><b>${fmt(g.target,g)}</b></div><div class="goalrow"><span>ממוצע היסטורי</span><b>${fmt(avg,g)}</b></div><div class="goalrow"><span>סטטוס</span><b><span class="state ${st.c}">${st.t}</span></b></div><div class="goalbar"><i style="width:${progress}%"></i></div><div class="sub">${range}</div><details class="why"><summary>למה זה היעד?</summary><p>${g.basis}</p></details></div>`}
function metric(label,value,key,raw,avg,sub=''){return `<article class="card metric"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}${goalHtml(key,raw,avg)}</article>`}function day(){return DATA.days[selected]}function statusClass(s){return s==='ACTIVE'?'active':'paused'}
function renderDots(){const i=dates.indexOf(selected);$('#dayDots').innerHTML=dates.map((_,j)=>`<i class="daydot ${j===i?'active':''}"></i>`).join('')}function setDate(){const i=dates.indexOf(selected),dt=new Date(selected+'T12:00:00');$('#older').disabled=$('#edgeOlder').disabled=i===0;$('#newer').disabled=$('#edgeNewer').disabled=i===dates.length-1;$('#dateLabel').textContent=dt.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit'});$('#dateMeta').textContent=i===dates.length-1?'snapshot אחרון':'היסטוריה';renderDots()}
function renderToday(){const d=day(),m=d.metaAds,s=d.shopify,go=DATA.metricGoals;const av=k=>avgMetric(k),avs=k=>avgMetric(k,'shopify');const a2c=ratio(m.addToCarts,m.landingPageViews),a2cAvg=dates.map(x=>ratio(DATA.days[x].metaAds.addToCarts,DATA.days[x].metaAds.landingPageViews)).reduce((a,b)=>a+b,0)/dates.length;const c2p=ratio(m.purchases,m.initiateCheckouts);$('#todayContent').innerHTML=metric('ROAS',num(m.roas),'roas',m.roas,av('roas'))+metric('CPM',money(m.cpm),'cpm',m.cpm,av('cpm'),'עלות 1,000 חשיפות')+metric('CTR',pct(m.ctr),'ctr',m.ctr,av('ctr'))+metric('CPC',money(m.cpc),'cpc',m.cpc,av('cpc'))+metric('Shopify CVR',pct(s.conversionRate),'shopifyCvr',s.conversionRate,avs('conversionRate'))+metric('Cost / LPV',money(m.costPerLandingPageView),'costPerLpv',m.costPerLandingPageView,av('costPerLandingPageView'))+metric('LPV → ATC',pct(a2c),'lpvToAtc',a2c,a2cAvg)+metric('CPA',money(m.costPerPurchase),'cpa',m.costPerPurchase,av('costPerPurchase'))+`<article class="card wide"><h2 class="title">Funnel</h2><div class="funnel"><div class="stage"><small>LPV</small><b>${num(m.landingPageViews)}</b></div><div class="stage"><small>ATC</small><b>${num(m.addToCarts)}</b><em>${pct(a2c)} מה-LPV</em></div><div class="stage"><small>Checkout</small><b>${num(m.initiateCheckouts)}</b><em>${pct(ratio(m.initiateCheckouts,m.addToCarts))} מה-ATC</em></div><div class="stage"><small>Purchase</small><b>${num(m.purchases)}</b><em>${pct(c2p)} מה-checkout</em></div></div></article><article class="card wide advisorBox"><span class="verdict">${d.advisor?.verdict||'REVIEW'}</span><h2>${d.advisor?.headline||'—'}</h2><p>${d.advisor?.body||''}</p></article>`}
const ids={'Winner CBO':'120248420474480135','ABO Testing':'120248307316790135','ABO Main Delivery':'120248307316790135','Historical CBO':'120234432398300135'};
function renderCampaigns(){const d=day();$('#campaignContent').innerHTML=`<article class="card full"><h2 class="title">Campaign Control</h2><div class="statusline">${backend?'Backend מחובר — פעולות דורשות אישור':'Read-only כרגע. הכפתורים מוכנים ל-/api/meta/action, בלי מפתחות בדפדפן.'}</div>${d.campaigns.map(c=>`<div class="campaign"><div class="campaignTop"><div><div class="cname">${c.shortName}</div><div class="cfull">${c.name}</div></div><span class="badge ${statusClass(c.status)}">${c.status}</span></div><div class="stats"><div class="stat"><small>Budget</small><b>${money(c.dailyBudget)}</b></div><div class="stat"><small>Spend</small><b>${money(c.spend)}</b></div><div class="stat"><small>ROAS</small><b>${num(c.roas)}</b></div><div class="stat"><small>LPV</small><b>${num(c.landingPageViews)}</b></div><div class="stat"><small>ATC</small><b>${num(c.addToCarts)}</b></div><div class="stat"><small>CPA</small><b>${money(c.costPerPurchase)}</b></div></div><div class="controls"><input class="budgetInput" type="number" step="1" min="1" value="${c.dailyBudget||''}" placeholder="$ budget"><button class="btn primary metaAction" data-action="set_budget" data-id="${ids[c.shortName]||''}" ${backend?'':'disabled'}>עדכן תקציב</button><button class="btn metaAction" data-action="enable" data-id="${ids[c.shortName]||''}" ${backend?'':'disabled'}>הפעל</button><button class="btn danger metaAction" data-action="pause" data-id="${ids[c.shortName]||''}" ${backend?'':'disabled'}>Pause</button></div><div class="advisorline">${c.advisor||''}</div></div>`).join('')}</article>`;bindMetaActions()}
function currentValues(){const m=day().metaAds,s=day().shopify;return{roas:m.roas,cpm:m.cpm,ctr:m.ctr,cpc:m.cpc,shopifyCvr:s.conversionRate,costPerLpv:m.costPerLandingPageView,lpvToAtc:ratio(m.addToCarts,m.landingPageViews),costPerAtc:m.costPerAddToCart,atcToCheckout:ratio(m.initiateCheckouts,m.addToCarts),costPerCheckout:m.costPerCheckout,checkoutToPurchase:ratio(m.purchases,m.initiateCheckouts),lpvToPurchase:ratio(m.purchases,m.landingPageViews),cpa:m.costPerPurchase}}
function histFor(k){const vals=dates.map(x=>{const m=DATA.days[x].metaAds,s=DATA.days[x].shopify;const map={roas:m.roas,cpm:m.cpm,ctr:m.ctr,cpc:m.cpc,shopifyCvr:s.conversionRate,costPerLpv:m.costPerLandingPageView,lpvToAtc:ratio(m.addToCarts,m.landingPageViews),costPerAtc:m.costPerAddToCart,atcToCheckout:ratio(m.initiateCheckouts,m.addToCarts),costPerCheckout:m.costPerCheckout,checkoutToPurchase:ratio(m.purchases,m.initiateCheckouts),lpvToPurchase:ratio(m.purchases,m.landingPageViews),cpa:m.costPerPurchase};return map[k]}).filter(Number.isFinite);return vals.reduce((a,b)=>a+b,0)/vals.length}
function renderTargets(){const cur=currentValues();$('#targetContent').innerHTML=`<article class="card full"><h2 class="title">Targets — המספר הוא ההגדרה של “טוב”</h2><div class="targetGrid">${Object.entries(DATA.metricGoals||{}).map(([k,g])=>{const v=cur[k],h=histFor(k),st=goalState(v,g);return `<div class="targetCard"><div class="targetTop"><div><b>${g.label}</b><div class="targetNow">${fmt(v,g)}</div></div><span class="state ${st.c}">${st.t}</span></div><div class="targetLines"><div><span>Target</span><strong>${g.direction==='lower'?'≤':'≥'} ${fmt(g.target,g)}</strong></div><div><span>Warning</span><strong>${g.direction==='lower'?'>':'<'} ${fmt(g.watch,g)}</strong></div><div><span>Historical avg</span><strong>${fmt(h,g)}</strong></div></div><div class="basis">${g.basis}</div></div>`}).join('')}</div></article>`}
function getGoals(){return JSON.parse(localStorage.getItem('tbGoals')||'{"monthlyRevenue":"","margin":"","dailySpend":"","risk":"defensive"}')}function saveGoals(){const g={monthlyRevenue:$('#gRev')?.value||'',margin:$('#gMargin')?.value||'',dailySpend:$('#gSpend')?.value||'',risk:$('#gRisk')?.value||'normal'};localStorage.setItem('tbGoals',JSON.stringify(g));toast('היעדים נשמרו מקומית. אחרי חיבור DB הם יישמרו בשרת.');renderAI()}
function contextPack(){const d=day(),g=getGoals(),last=dates.slice(-7);const roll=n=>{const ds=last.slice(-n),a=k=>ds.map(x=>DATA.days[x].metaAds[k]).filter(Number.isFinite),sum=k=>a(k).reduce((x,y)=>x+y,0),avg=k=>a(k).reduce((x,y)=>x+y,0)/Math.max(1,a(k).length);return{days:ds,spend:sum('spend'),purchases:sum('purchases'),roas:avg('roas'),cpm:avg('cpm'),ctr:avg('ctr'),cpc:avg('cpc')}};return{version:'context-v1',goals:g,current:{date:selected,meta:d.metaAds,shopify:d.shopify,campaigns:d.campaigns.map(c=>({name:c.shortName,status:c.status,budget:c.dailyBudget,spend:c.spend,roas:c.roas,lpv:c.landingPageViews,atc:c.addToCarts,checkout:c.checkouts,purchases:c.purchases}))},rolling:{d3:roll(3),d7:roll(7)},strategy:MEMORY?.strategy||{},rules:MEMORY?.operatingPrinciples||[],recentDecisions:(DATA.decisionLog||[]).slice(-20),unitEconomics:{status:'not_connected'},note:'Full raw history intentionally excluded; backend will retrieve relevant analogs.'}}
function localAdvice(){const d=day(),m=d.metaAds,g=DATA.metricGoals,changes=(DATA.decisionLog||[]).filter(x=>x.date===selected).length,a2c=ratio(m.addToCarts,m.landingPageViews),atc=ratio(m.initiateCheckouts,m.addToCarts),cp=ratio(m.purchases,m.initiateCheckouts);let verdict='KEEP',headline='לא לשנות מבנה כרגע',body='המערכת המקומית מחפשת קודם צוואר בקבוק לפני שינוי מדיה.';if(changes>=2){verdict='STOP';headline='Freeze על שינויים נוספים';body='כבר יש צפיפות שינויים גבוהה. עדיף לשמור את המצב ולחכות לחלון הבדיקה הבא.'}else if(a2c<g.lpvToAtc.watch){verdict='INVESTIGATE';headline='הבעיה נראית לפני ה-ATC';body='הכיוון הראשון לבדיקה הוא offer / landing page / message match, לא בהכרח מבנה הקמפיין.'}else if(m.addToCarts>=4&&atc<g.atcToCheckout.watch){verdict='INVESTIGATE';headline='החיכוך נמצא Cart → Checkout';body='יש כוונת קנייה, אבל היא נופלת לפני checkout. לבדוק cart, משלוח, מחיר, UX והפתעות בעלות.'}else if(m.initiateCheckouts>=3&&cp<g.checkoutToPurchase.watch){verdict='INVESTIGATE';headline='החיכוך נמצא Checkout → Purchase';body='לבדוק payment, trust, checkout ותקלה טכנית לפני שינוי מודעות.'}return{verdict,headline,body}}
function reviewLocal(t){try{const [h,m]=t.split(':').map(Number),d=new Date();const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});const z=new Date(`${p.year}-${p.month}-${p.day}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00+03:00`);return z.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch{return'—'}}
function renderAI(){const g=getGoals(),a=localAdvice(),pack=contextPack(),rw=MEMORY?.reviewWindowsIsrael||['15:00','22:00','03:00','06:00'];$('#aiContent').innerHTML=`<div class="grid"><article class="card full advisorBox"><span class="verdict">${a.verdict} · LOCAL RULES</span><h2>${a.headline}</h2><p>${a.body}</p><div class="bigAction"><button class="btn primary" id="askAi">מה לעשות היום?</button><button class="btn" id="showContext">הצג Context Pack</button></div><div class="statusline">OpenAI עדיין לא מחובר. הכפתור מוכן ל-/api/advisor; עד אז ההמלצה היא deterministic ולא “AI שממציא”.</div></article><article class="card wide"><h2 class="title">Account Goal</h2><div class="formGrid"><div class="fieldWrap"><label>הכנסה חודשית יעד ($)</label><input class="field" id="gRev" type="number" value="${g.monthlyRevenue}"></div><div class="fieldWrap"><label>Contribution margin יעד (%)</label><input class="field" id="gMargin" type="number" value="${g.margin}"></div><div class="fieldWrap"><label>Daily spend ceiling ($)</label><input class="field" id="gSpend" type="number" value="${g.dailySpend}"></div><div class="fieldWrap"><label>Risk mode</label><select class="select" id="gRisk"><option value="defensive" ${g.risk==='defensive'?'selected':''}>Defensive</option><option value="normal" ${g.risk==='normal'?'selected':''}>Normal</option><option value="growth" ${g.risk==='growth'?'selected':''}>Growth</option></select></div></div><button class="btn primary" id="saveGoals" style="margin-top:9px">שמור יעד</button></article><article class="card wide"><h2 class="title">Memory + Review System</h2><div class="memoryStrip"><div class="memoryItem"><small>Context</small><b>Current + 3d + 7d</b></div><div class="memoryItem"><small>Decisions</small><b>Last 20</b></div><div class="memoryItem"><small>Historical analogs</small><b>Retrieve relevant only</b></div><div class="memoryItem"><small>Writes</small><b>Human approval</b></div></div><div class="advisorline">חלונות בדיקה: ${rw.map(x=>`${x} IL (${reviewLocal(x)} local)`).join(' · ')}</div></article><article class="card full" id="contextWrap" style="display:none"><h2 class="title">Context Pack Preview</h2><pre class="codeish">${escapeHtml(JSON.stringify(pack,null,2))}</pre></article></div>`;$('#saveGoals').onclick=saveGoals;$('#showContext').onclick=()=>{const w=$('#contextWrap');w.style.display=w.style.display==='none'?'block':'none'};$('#askAi').onclick=async()=>{if(!backend){toast('OpenAI עדיין לא מחובר — מוצגת כרגע המלצת Rules Engine.');return}try{const r=await fetch('/api/advisor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'today'})});const j=await r.json();toast(j.primary_reason||'Advisor updated')}catch{toast('Advisor backend לא זמין')}}}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderGuard(){const rules=MEMORY?.operatingPrinciples||DATA.decisionPolicy?.rules||[];$('#guardContent').innerHTML=`<div class="grid"><article class="card wide"><h2 class="title">Decision Guard</h2><ol class="rules">${rules.map(r=>`<li>${r}</li>`).join('')}</ol></article><article class="card wide"><h2 class="title">Future automation phases</h2><ol class="rules"><li>Phase 1 — AI recommends only.</li><li>Phase 2 — AI prepares budget/status action; you tap Approve.</li><li>Phase 3 — only pre-authorized low-risk rules may auto-execute.</li><li>Hard alerts may fire outside review windows, but discretionary changes wait.</li></ol></article></div>`}
function renderLedger(){const x=DATA.decisionLog||[];$('#ledgerContent').innerHTML=`<article class="card full"><h2 class="title">Account Decision Ledger</h2><div class="statusline">Frontend מציג כרגע reconstructed history. ה-DB schema כבר מוכן ל-snapshots, decisions, unit economics ו-cash.</div>${x.map(e=>`<div class="log"><small>${e.date}</small><b>${e.action}</b><span>${e.assessment}</span></div>`).join('')}</article>`}
function render(){if(!DATA||!selected)return;setDate();renderToday();renderCampaigns();renderTargets();renderAI();renderGuard();renderLedger()}
function targetFor(dx){const i=dates.indexOf(selected);return dx>0?i>0:i<dates.length-1}function preview(dx){const i=dates.indexOf(selected),n=dx>0?i-1:i+1;if(n<0||n>=dates.length){$('#swipePreview').style.opacity='0';return}const d=new Date(dates[n]+'T12:00:00');$('#previewPill').innerHTML=`${d.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit'})}<small>${dx>0?'יום קודם':'יום הבא'}</small>`;$('#swipePreview').style.opacity=String(Math.min(.95,Math.abs(dx)/120));$('#swipePreview').style.transform=`scale(${.98+Math.min(.02,Math.abs(dx)/5000)})`}
function resetCard(){const s=$('#swipeSurface');s.style.transition='transform .25s cubic-bezier(.2,.9,.25,1)';s.style.transform='translate3d(0,0,0) rotate(0deg)';s.classList.remove('dragging');$('#swipePreview').style.opacity='0';setTimeout(()=>s.style.transition='',260)}function commit(dx){if(animating||!targetFor(dx)){resetCard();return}animating=true;const s=$('#swipeSurface'),w=innerWidth*1.15,dir=dx>0?1:-1;s.style.transition='transform .2s ease-in,opacity .2s';s.style.transform=`translate3d(${dir*w}px,0,0) rotate(${dir*7}deg)`;s.style.opacity='.2';setTimeout(()=>{const i=dates.indexOf(selected);selected=dates[i+(dx>0?-1:1)];render();s.style.transition='none';s.style.transform=`translate3d(${-dir*70}px,0,0) rotate(${-dir*2}deg)`;s.style.opacity='.4';requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transition='transform .24s cubic-bezier(.2,.9,.25,1),opacity .2s';s.style.transform='translate3d(0,0,0) rotate(0deg)';s.style.opacity='1';$('#swipePreview').style.opacity='0';setTimeout(()=>{animating=false;s.style.transition=''},250)}))},190)}
const surface=$('#swipeSurface');let tg=null;surface.addEventListener('touchstart',e=>{if(animating||e.touches.length!==1)return;const t=e.touches[0];tg={x:t.clientX,y:t.clientY,lastX:t.clientX,lastY:t.clientY,time:performance.now(),locked:null};surface.style.transition='none'},{passive:true});surface.addEventListener('touchmove',e=>{if(!tg||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-tg.x,dy=t.clientY-tg.y;tg.lastX=t.clientX;tg.lastY=t.clientY;if(tg.locked==null&&Math.hypot(dx,dy)>7)tg.locked=Math.abs(dx)>Math.abs(dy)*.82?'x':'y';if(tg.locked==='x'){e.preventDefault();const lim=Math.max(-innerWidth*.72,Math.min(innerWidth*.72,dx));surface.classList.add('dragging');surface.style.transform=`translate3d(${lim}px,0,0) rotate(${Math.max(-5,Math.min(5,lim/65))}deg)`;preview(lim)}},{passive:false});surface.addEventListener('touchend',e=>{if(!tg)return;const dx=tg.lastX-tg.x,dt=Math.max(1,performance.now()-tg.time),v=Math.abs(dx)/dt,wasX=tg.locked==='x';tg=null;if(wasX&&(Math.abs(dx)>78||v>.52)&&targetFor(dx))commit(dx);else resetCard()},{passive:true});surface.addEventListener('touchcancel',()=>{tg=null;resetCard()},{passive:true});
function move(dir){const i=dates.indexOf(selected),n=i+dir;if(n<0||n>=dates.length)return;selected=dates[n];render();resetCard()}
function bindMetaActions(){$$('.metaAction').forEach(b=>b.onclick=async e=>{if(!backend)return;const row=e.target.closest('.campaign'),amount=row.querySelector('.budgetInput')?.value;const body={action:b.dataset.action,id:b.dataset.id,scope:'campaign',amount:b.dataset.action==='set_budget'?Number(amount):null};try{const r=await fetch('/api/meta/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;toast('הפעולה הוכנה/בוצעה דרך ה-backend');await load(false)}catch{toast('Meta action failed')}})}
async function pingBackend(){try{const r=await fetch('/api/state',{cache:'no-store'});backend=r.ok}catch{backend=false}$('#backendPill').textContent=backend?'Backend: connected':'Backend: read-only'}
async function load(first=false){try{const [dr,mr,lr]=await Promise.all([fetch('data.json?ts='+Date.now(),{cache:'no-store'}),fetch('context/account-memory.json?ts='+Date.now(),{cache:'no-store'}).catch(()=>null),fetch('ledger/events.jsonl?ts='+Date.now(),{cache:'no-store'}).catch(()=>null)]);DATA=await dr.json();MEMORY=mr&&mr.ok?await mr.json():null;LEDGER=lr&&lr.ok?(await lr.text()).trim().split('\n').filter(Boolean).map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean):[];dates=Object.keys(DATA.days).sort();if(first||!dates.includes(selected))selected=dates.at(-1);const t=new Date(DATA.meta.lastUpdated);$('#updated').textContent='עודכן '+t.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});render()}catch(e){$('#updated').textContent='sync error'}}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');resetCard()});$('#older').onclick=$('#edgeOlder').onclick=()=>move(-1);$('#newer').onclick=$('#edgeNewer').onclick=()=>move(1);$('#refreshBtn').onclick=async()=>{toast('מרענן נתונים…');if(backend)try{await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sources:['meta','shopify']})})}catch{}await load(false);toast('רענון הושלם')};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(-1);if(e.key==='ArrowLeft')move(1)});(async()=>{await pingBackend();await load(true);setInterval(()=>load(false),30000)})();
</script></body></html>
