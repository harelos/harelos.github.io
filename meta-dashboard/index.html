<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TigerBrands — Meta & Shopify Control Room</title>
  <meta name="theme-color" content="#050507" />
  <style>
    :root{--bg:#050507;--panel:#0d0d12;--panel2:#12121a;--line:#252532;--text:#f5f5f7;--muted:#9696a5;--purple:#8b5cf6;--purple2:#a78bfa;--red:#ef4444;--red2:#fb7185;--shadow:0 22px 70px rgba(0,0,0,.45)}
    *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;background:radial-gradient(circle at 78% 0%,rgba(139,92,246,.12),transparent 32%),radial-gradient(circle at 0% 15%,rgba(239,68,68,.08),transparent 26%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
    button{font:inherit}.wrap{width:min(1280px,calc(100% - 28px));margin:0 auto;padding:24px 0 64px}.top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.brand h1{font-size:clamp(26px,4vw,44px);margin:0;letter-spacing:-.04em}.brand p{margin:9px 0 0;color:var(--muted);font-size:14px}.livebox{display:flex;align-items:center;gap:9px;background:#0c0c11;border:1px solid var(--line);padding:10px 13px;border-radius:999px;color:#d7d7df;font-size:12px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(239,68,68,.12),0 0 18px rgba(239,68,68,.65);animation:pulse 1.7s infinite}@keyframes pulse{50%{opacity:.42}}
    .tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#0a0a0e;color:#b8b8c2;border-radius:12px;padding:10px 14px;cursor:pointer;white-space:nowrap}.tab.active{background:linear-gradient(135deg,rgba(139,92,246,.24),rgba(239,68,68,.11));border-color:rgba(139,92,246,.55);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,92,246,.08)}
    .section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(180deg,rgba(17,17,24,.96),rgba(10,10,14,.96));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 35px rgba(0,0,0,.18)}.metric{grid-column:span 3;min-height:128px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:92px;height:92px;border-radius:50%;left:-26px;bottom:-36px;background:radial-gradient(circle,rgba(139,92,246,.17),transparent 70%)}.metric.red:after{background:radial-gradient(circle,rgba(239,68,68,.18),transparent 70%)}.label{color:var(--muted);font-size:12px;margin-bottom:13px}.value{font-size:clamp(28px,3.5vw,40px);font-weight:800;letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted);margin-top:8px}.delta{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;margin-top:8px;font-size:11px;border:1px solid rgba(139,92,246,.28);background:rgba(139,92,246,.09);color:#c4b5fd}.delta.bad{border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.08);color:#fda4af}
    .wide{grid-column:span 6}.full{grid-column:1/-1}.title{font-size:16px;font-weight:750;margin:0 0 14px}.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{background:#09090d;border:1px solid #20202b;border-radius:14px;padding:13px}.step strong{display:block;font-size:24px}.step span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.bar{height:7px;background:#1b1b24;border-radius:99px;overflow:hidden;margin-top:12px}.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--purple),#c084fc)}.bar.red>i{background:linear-gradient(90deg,var(--red),var(--red2))}
    .campaign{display:grid;grid-template-columns:1.4fr .7fr repeat(5,.55fr);gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #1f1f29}.campaign:last-child{border-bottom:none}.campaign .name{font-weight:700;font-size:13px}.campaign .mini{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.k{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}.v{font-weight:700;font-size:13px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.03em}.badge.pause{color:#fecaca;background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22)}.badge.active{color:#ddd6fe;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.26)}
    .callout{padding:16px;border-radius:16px;border:1px solid #262633;background:#0b0b10;margin-bottom:10px;position:relative;overflow:hidden}.callout:before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--purple)}.callout.red:before{background:var(--red)}.callout h3{margin:0 0 7px;font-size:15px}.callout p{margin:0;color:#b7b7c2;line-height:1.65;font-size:13px}.guard{counter-reset:guard}.guard li{list-style:none;counter-increment:guard;margin:0 0 10px;padding:14px 48px 14px 14px;background:#0a0a0f;border:1px solid #22222d;border-radius:14px;position:relative;color:#c9c9d1;line-height:1.55;font-size:13px}.guard li:before{content:counter(guard);position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:8px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.24);display:grid;place-items:center;color:#c4b5fd;font-weight:800}
    .logrow{display:grid;grid-template-columns:110px 1fr 1.5fr;gap:12px;padding:13px 0;border-bottom:1px solid #1f1f29}.logrow:last-child{border-bottom:none}.logdate{font-size:11px;color:var(--muted)}.logaction{font-size:13px;font-weight:750}.logreason{font-size:12px;color:#b4b4c0;line-height:1.5}.sync{margin-top:16px;padding:12px 14px;border-radius:14px;border:1px dashed #2b2b39;color:var(--muted);font-size:11px;line-height:1.5}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comparebox{padding:13px;border-radius:14px;border:1px solid #20202a;background:#09090d}.comparebox b{font-size:12px}.comparebox strong{font-size:25px;display:block;margin-top:7px}.comparebox small{color:var(--muted)}
    .error{padding:18px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);border-radius:16px;color:#fecaca}.footer{margin-top:28px;color:#6f6f7e;font-size:11px;text-align:center}
    @media(max-width:900px){.metric{grid-column:span 6}.wide{grid-column:1/-1}.campaign{grid-template-columns:1fr 1fr 1fr}.campaign .name{grid-column:1/-1}.campaign .note{grid-column:1/-1}.funnel{grid-template-columns:1fr 1fr}.logrow{grid-template-columns:1fr}.top{flex-direction:column}.livebox{align-self:flex-start}}
    @media(max-width:560px){.wrap{width:min(100% - 18px,1280px);padding-top:14px}.metric{grid-column:span 6;padding:13px;min-height:116px}.value{font-size:29px}.campaign{grid-template-columns:1fr 1fr}.funnel{grid-template-columns:1fr 1fr}.brand h1{font-size:29px}.card{border-radius:15px}.compare{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><h1>Control Room</h1><p id="subtitle">TigerBrands · Meta + Shopify</p></div>
      <div class="livebox"><span class="dot"></span><span id="updated">טוען נתונים…</span></div>
    </header>

    <nav class="tabs" aria-label="Dashboard tabs">
      <button class="tab active" data-tab="overview">מצב עכשיו</button>
      <button class="tab" data-tab="campaigns">קמפיינים</button>
      <button class="tab" data-tab="funnel">פאנל Shopify</button>
      <button class="tab" data-tab="conclusions">מסקנות</button>
      <button class="tab" data-tab="guardrails">Decision Guard</button>
      <button class="tab" data-tab="history">יומן החלטות</button>
    </nav>

    <section id="overview" class="section active"><div id="overviewContent" class="grid"></div></section>
    <section id="campaigns" class="section"><div id="campaignContent"></div></section>
    <section id="funnel" class="section"><div id="funnelContent" class="grid"></div></section>
    <section id="conclusions" class="section"><div id="conclusionContent"></div></section>
    <section id="guardrails" class="section"><div id="guardContent"></div></section>
    <section id="history" class="section"><div id="historyContent"></div></section>

    <div class="sync" id="syncNote"></div>
    <div class="footer">TigerBrands Control Room · GitHub Pages · data.json auto-refresh</div>
  </main>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const money=n=>n==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n);
const num=n=>n==null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n);
const pct=n=>n==null?'—':`${num(n)}%`;
function delta(now,prev,lowerBetter=false){if(prev==null||prev===0)return ''; const d=((now-prev)/prev)*100; const favorable=lowerBetter?d<0:d>0; return `<span class="delta ${favorable?'':'bad'}">${d>=0?'+':''}${d.toFixed(0)}% מול אתמול</span>`}
function metric(label,value,sub='',red=false,extra=''){return `<article class="card metric ${red?'red':''}"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}${extra}</article>`}
function actionValue(actions,type){const x=(actions||[]).find(a=>a.action_type===type);return x?Number(x.value):0}
function render(d){
 $('#subtitle').textContent=d.meta.dashboardTitle;
 const t=new Date(d.meta.lastUpdated); $('#updated').textContent=`עודכן ${t.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ישראל`;
 const m=d.today.metaAds, y=d.yesterday.metaAds, s=d.today.shopify, sy=d.yesterday.shopify;
 $('#overviewContent').innerHTML=
   metric('Meta Spend',money(m.spend),'הוצאה היום',true)+
   metric('Purchases',num(m.purchases),'Attributed by Meta',m.purchases===0)+
   metric('Meta ROAS',num(m.roas),'Purchase ROAS',m.roas<2,delta(m.roas,y.roas))+
   metric('Shopify CVR',pct(s.conversionRate),'Store conversion rate',false,delta(s.conversionRate,sy.conversionRate))+
   metric('Landing Page Views',num(m.landingPageViews),money(m.costPerLandingPageView)+' / LPV')+
   metric('Add to Cart',num(m.addToCarts),money(m.costPerAddToCart)+' / ATC')+
   metric('Checkouts',num(m.initiateCheckouts),money(m.costPerCheckout)+' / checkout',m.initiateCheckouts<2)+
   metric('CPA',money(m.costPerPurchase),'Meta attributed',true,delta(m.costPerPurchase,y.costPerPurchase,true))+
   `<article class="card wide"><h2 class="title">Paid funnel</h2><div class="funnel">${step('LPV',m.landingPageViews,100)}${step('ATC',m.addToCarts,m.landingPageViews?m.addToCarts/m.landingPageViews*100:0)}${step('Checkout',m.initiateCheckouts,m.landingPageViews?m.initiateCheckouts/m.landingPageViews*100:0,true)}${step('Purchase',m.purchases,m.landingPageViews?m.purchases/m.landingPageViews*100:0,true)}</div></article>`+
   `<article class="card wide"><h2 class="title">Today vs yesterday</h2><div class="compare"><div class="comparebox"><b>Meta ROAS</b><strong>${num(m.roas)}</strong><small>אתמול ${num(y.roas)}</small></div><div class="comparebox"><b>Shopify cart rate</b><strong>${pct(s.cartRate)}</strong><small>אתמול ${pct(sy.cartRate)}</small></div></div></article>`;

 $('#campaignContent').innerHTML=`<article class="card full"><h2 class="title">Campaign state + performance</h2>${d.campaigns.map(c=>`<div class="campaign"><div><div class="name">${c.shortName}</div><div class="mini">${c.name}</div></div><div><span class="k">Status</span><span class="badge ${c.status==='ACTIVE'?'active':'pause'}">${c.status}</span></div><div><span class="k">Budget</span><span class="v">${money(c.dailyBudget)}</span></div><div><span class="k">Spend</span><span class="v">${money(c.spend)}</span></div><div><span class="k">ATC</span><span class="v">${num(c.addToCarts)}</span></div><div><span class="k">Purchases</span><span class="v">${num(c.purchases)}</span></div><div><span class="k">ROAS</span><span class="v">${num(c.roas)}</span></div><div class="mini note">${c.note}</div></div>`).join('')}</article>`;

 $('#funnelContent').innerHTML=
   metric('Sessions',num(s.sessions),'Shopify')+
   metric('Cart sessions',num(s.sessionsWithCartAdditions),pct(s.cartRate)+' of sessions')+
   metric('Reached checkout',num(s.sessionsReachedCheckout),pct(s.checkoutRate)+' of sessions')+
   metric('Completed checkout',num(s.sessionsCompletedCheckout),pct(s.conversionRate)+' CVR',s.sessionsCompletedCheckout<1)+
   `<article class="card wide"><h2 class="title">Shopify funnel today</h2><div class="funnel">${step('Sessions',s.sessions,100)}${step('Cart',s.sessionsWithCartAdditions,s.cartRate)}${step('Checkout',s.sessionsReachedCheckout,s.checkoutRate,true)}${step('Purchase',s.sessionsCompletedCheckout,s.conversionRate,true)}</div></article>`+
   `<article class="card wide"><h2 class="title">Store revenue</h2><div class="compare"><div class="comparebox"><b>Total sales</b><strong>${money(s.totalSales)}</strong><small>${num(s.orders)} order(s)</small></div><div class="comparebox"><b>AOV</b><strong>${money(s.aov)}</strong><small>Yesterday ${money(sy.aov)}</small></div></div></article>`;

 $('#conclusionContent').innerHTML=`<article class="card"><h2 class="title">מסקנות והמלצה</h2>${d.conclusions.map(x=>`<div class="callout ${x.level==='red'?'red':''}"><h3>${x.title}</h3><p>${x.body}</p></div>`).join('')}</article>`;
 $('#guardContent').innerHTML=`<article class="card"><h2 class="title">${d.guardrails.title}</h2><ol class="guard">${d.guardrails.rules.map(x=>`<li>${x}</li>`).join('')}</ol></article>`;
 $('#historyContent').innerHTML=`<article class="card"><h2 class="title">Decision Log</h2>${d.decisionLog.map(x=>`<div class="logrow"><div class="logdate">${x.date}<br>${x.source}</div><div class="logaction">${x.action}</div><div class="logreason">${x.reason}</div></div>`).join('')}</article>`;
 $('#syncNote').innerHTML=`<strong>Sync:</strong> ${d.meta.syncMode}. הדף בודק את <code>data.json</code> כל ${d.meta.refreshSeconds} שניות, ולכן כל עדכון חדש יופיע כאן אוטומטית בלי לפתוח לינק חדש. Git שומר גם היסטוריית commits מלאה.`;
}
function step(name,val,rate,red=false){return `<div class="step"><strong>${num(val)}</strong><span>${name}${rate!==100?` · ${pct(rate)}`:''}</span><div class="bar ${red?'red':''}"><i style="width:${Math.max(3,Math.min(100,rate))}%"></i></div></div>`}
async function load(){try{const r=await fetch(`data.json?t=${Date.now()}`,{cache:'no-store'}); if(!r.ok)throw new Error('data'); render(await r.json())}catch(e){$('#overviewContent').innerHTML='<div class="error full">לא הצלחתי לטעון את data.json. נסה רענון בעוד רגע.</div>'}}
$$('.tab').forEach(b=>b.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')}));
load(); setInterval(load,30000);
</script>
</body>
</html>
